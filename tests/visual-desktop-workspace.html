    <script src="../js/desktop-sales.js"></script>
    <script src="../js/desktop-settings.js"></script>
    <script>
      const app = document.querySelector("#app");
      function show(view) {
        document
          .querySelectorAll("[data-view]")
          .forEach((button) =>
            button.classList.toggle("active", button.dataset.view === view),
          );
        app.innerHTML =
          view === "sales"
            ? DesktopSales.render({
                products,
                clients,
                cart,
                totals: {
                  subtotalOriginal: 21,
                  descontoTotal: 0,
                  valorFinal: 21,
                },
              })
            : DesktopSettings.render();
        if (view === "sales") DesktopSales.bind();
      }
      document
        .querySelectorAll("[data-view]")
        .forEach(
          (button) => (button.onclick = () => show(button.dataset.view)),
        );
      show(
        new URLSearchParams(location.search).get("view") === "settings"
          ? "settings"
          : "sales",
      );
    </script>
