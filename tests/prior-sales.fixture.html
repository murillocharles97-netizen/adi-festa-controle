<script src="../js/utils.js"></script><script>
window.qaReady=(async()=>{const r=await fetch('/qa-boot'),info=await r.json();window.qaInfo=info;let data=info.local;const member={uid:info.uid,role:'owner',status:'active'},business={id:info.businessId,ownerId:info.uid};window.FirebaseSession={user:{uid:info.uid},businessId:info.businessId,business};window.BusinessContext={get:()=>({businessId:info.businessId,role:'owner',member,business,userProfile:{uid:info.uid,businessId:info.businessId,active:true},access:{canMutate:true}})};window.TeamAccess={has:()=>true,captureSession:()=>JSON.stringify([info.uid,info.businessId,info.spaceId]),actor:()=>({actorUid:info.uid,actorRoleSnapshot:'owner'})};window.DB={carregar:()=>data,getBusinessId:()=>info.businessId,getPrincipal:()=>info.uid,getWorkspaceGeneration:()=>0,flush:async()=>{},alterar:()=>{throw Error('QA: unexpected local commercial mutation');}};window.Repositories={productRepository:()=>({list:()=>data.produtos,getById:id=>data.produtos.find(x=>x.id===id)}),clientRepository:()=>({list:()=>data.clientes,getById:id=>data.clientes.find(x=>x.id===id)}),saleRepository:()=>({list:()=>data.vendas,create:()=>{throw Error('QA: prior sale must use the authorized server channel');}})};window.Produtos={obter:id=>data.produtos.find(x=>x.id===id)};window.Clientes={listar:()=>data.clientes};window.Campanhas={aplicarBeneficios:x=>x,resumoCarrinho:()=>[]};window.SpaceContext={salesId:()=>info.spaceId,requireSalesSpace:()=>info.spaceId,list:()=>[{id:info.spaceId}],bind(){}};window.SpaceEngine={productAllowsSpace:()=>true};window.Router={atual:()=> 'vender'};window.productControlsStock=()=>true;window.getProductStockStatus=()=> 'disponivel';window.OperationMode={enabled:()=>false};window.SyncFirebase={isSalePending:()=>false,pullCloudCollections:async()=>{const fresh=await(await fetch('/qa-local')).json();data=fresh;dispatchEvent(new CustomEvent('cloud-data-updated'));}};window.FirebaseCallable=async(name,payload)=>{const r=await fetch('/qa-call',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+info.token},body:JSON.stringify({name,data:payload})}),json=await r.json();if(!r.ok)throw Object.assign(Error(json.message),{code:json.code});return{data:json};};window.qaTokenLoaded=true;})();
