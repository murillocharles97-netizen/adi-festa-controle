<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VECONI Visual QA</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="stylesheet" href="../css/mobile-fixes.css">
  <link rel="stylesheet" href="../css/clientes-mobile.css">
  <link rel="stylesheet" href="../css/mobile-navigation.css">
  <link rel="stylesheet" href="../css/design-system/veconi-theme.css">
  <style>
    body{margin:0}.qa-sidebar{overflow:auto}.qa-main{max-width:1440px}.qa-page{display:grid;gap:18px}.qa-heading{display:flex;align-items:end;justify-content:space-between;gap:16px}.qa-heading h2,.qa-heading p{margin:0}.qa-heading h2{font-size:30px}.qa-heading p{margin-top:5px;color:var(--veconi-text-muted);font-size:15px}.qa-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.qa-kpi{min-height:132px;padding:19px;border:1px solid var(--veconi-border);border-radius:var(--veconi-radius-card);background:#fff;box-shadow:var(--veconi-shadow-sm)}.qa-kpi span{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--veconi-primary-soft);color:#087f75}.qa-kpi b,.qa-kpi small{display:block}.qa-kpi b{margin-top:14px;font-size:23px}.qa-kpi small{margin-top:4px;color:var(--veconi-text-muted)}.qa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.qa-panel{overflow:hidden;border:1px solid var(--veconi-border);border-radius:var(--veconi-radius-card);background:#fff;box-shadow:var(--veconi-shadow-sm)}.qa-panel header{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--veconi-border)}.qa-panel h3{margin:0}.qa-list{display:grid}.qa-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:72px;padding:12px 17px;border-bottom:1px solid #edf1f4}.qa-row:last-child{border-bottom:0}.qa-row>i{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--veconi-primary-soft);color:#087f75;font-style:normal;font-weight:900}.qa-row b,.qa-row small{display:block}.qa-row small{margin-top:4px;color:var(--veconi-text-muted)}.qa-value{color:#087f75;font-weight:850}.qa-danger{color:var(--veconi-danger)}.qa-status{padding:6px 9px;border-radius:99px;background:var(--veconi-success-soft);color:#08785c;font-size:11px;font-weight:850}.qa-status.warning{background:var(--veconi-warning-soft);color:#955d08}.qa-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.qa-product{position:relative;min-height:190px;padding:14px;border:1px solid var(--veconi-border);border-radius:16px;background:#fff}.qa-product .photo{display:grid;place-items:center;height:96px;border-radius:13px;background:linear-gradient(145deg,#e9fbf7,#f2f5f8);color:#079184;font-size:28px;font-weight:900}.qa-product b,.qa-product small{display:block}.qa-product b{margin-top:11px}.qa-product small{margin-top:4px;color:var(--veconi-text-muted)}.qa-product strong{display:block;margin-top:8px;color:#078f83}.qa-product button{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border:0;border-radius:50%;background:var(--veconi-primary);color:#062529;font-size:22px}.qa-toolbar{display:flex;gap:10px}.qa-toolbar .search{min-height:50px}.qa-toolbar .btn{white-space:nowrap}.qa-tabs{display:flex;gap:7px;padding:7px;border:1px solid var(--veconi-border);border-radius:15px;background:#fff}.qa-tabs button{min-height:42px;flex:1;border:0;border-radius:10px;background:transparent;color:var(--veconi-text-muted);font-weight:800}.qa-tabs button.active{background:var(--veconi-primary-soft);color:#087f75}.qa-hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;min-height:150px;padding:23px;border-radius:20px;background:linear-gradient(120deg,#071821,#0b4650);color:#fff}.qa-hero h3{margin:0;font-size:25px}.qa-hero p{margin:8px 0 0;color:#b8cbd1}.qa-hero img{width:110px;height:110px}.qa-cart{grid-column:span 1}.qa-wide{grid-column:span 2}.qa-login-wrap{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 12%,rgba(22,205,187,.16),transparent 34%),linear-gradient(145deg,#061016,#09232c 72%,#06383a)}.qa-login-wrap .auth-card{display:grid;padding:30px}.qa-login-wrap .auth-card form{display:grid;gap:13px}.qa-login-wrap label{display:grid;gap:6px;text-align:left}.qa-login-wrap input{min-height:50px;padding:0 13px;border:1px solid var(--veconi-border);border-radius:12px}.qa-brand-note{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--veconi-text-muted);font-size:12px}.qa-brand-note img{width:23px;height:23px}.qa-drawer-demo .sidebar{transform:translateX(0)!important}.qa-drawer-demo .overlay{position:fixed;inset:0;background:rgba(5,17,26,.62);z-index:35}.qa-drawer-demo .shell,.qa-drawer-demo .bottom-nav{filter:blur(1px)}
    @media(max-width:767px){.qa-main{padding:18px 14px}.qa-page{gap:14px}.qa-heading{align-items:flex-start}.qa-heading h2{font-size:25px}.qa-heading .btn{display:none}.qa-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.qa-kpi{min-height:115px;padding:14px}.qa-kpi b{font-size:20px}.qa-grid{grid-template-columns:1fr;gap:10px}.qa-products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.qa-panel.qa-wide{grid-column:1/-1}.qa-row{grid-template-columns:38px minmax(0,1fr) auto;min-height:66px;padding:10px 13px}.qa-row>i{width:38px;height:38px}.qa-product{min-height:180px;padding:10px}.qa-product .photo{height:88px}.qa-toolbar{display:grid;grid-template-columns:1fr auto}.qa-toolbar .search{grid-column:1/-1}.qa-tabs button{min-width:0;padding-inline:5px}.qa-hero{min-height:135px;padding:18px}.qa-hero img{width:78px;height:78px}.qa-cart{grid-column:1/-1}.sidebar .brand{display:grid!important}.sidebar .brand-platform{display:flex!important}}
    @media(max-width:350px){.qa-kpis,.qa-products{grid-template-columns:1fr}.qa-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside class="sidebar qa-sidebar" id="sidebar">
    <div class="brand"><div class="brand-platform" data-veconi-logo="horizontal" data-veconi-tagline="true"></div><div class="brand-business"><span>AF</span><div class="brand-business-copy"><strong>Adi Festa</strong><small>Negócio ativo</small><span class="mobile-plan-pill">VECONI Profissional</span></div></div><button class="mobile-drawer-close" aria-label="Fechar"><i data-lucide="x"></i></button></div>
    <nav class="desktop-sidebar-nav" id="qa-nav"></nav>
    <div class="mobile-sidebar-scroll"><nav class="mobile-sidebar-nav" id="qa-mobile-nav"></nav></div>
    <footer class="desktop-sidebar-footer"><span></span>Dados salvos neste aparelho</footer><footer class="mobile-sidebar-footer"><span>VECONI <b>v123</b></span><span class="mobile-sync-state"><i data-lucide="cloud"></i><b>Sincronizado</b></span></footer>
  </aside>
  <div class="overlay"></div>
  <div class="shell"><header class="topbar"><button class="icon-btn menu-btn"><i data-lucide="menu"></i></button><div class="topbar-title"><img class="topbar-brand-mark" src="../assets/veconi-symbol.svg" alt=""><div class="topbar-title-copy"><h1 id="title"></h1><small id="subtitle"></small></div></div><span class="local-badge"><i data-lucide="cloud"></i> Nuvem</span><span class="avatar">M</span></header><main class="qa-main" id="app"></main></div>
  <nav class="bottom-nav"><a class="active"><i data-lucide="house"></i><span>Início</span></a><a><i data-lucide="shopping-bag"></i><span>Vender</span></a><button class="mobile-client-fab"><i data-lucide="plus"></i><span>Ação rápida</span></button><a><i data-lucide="users"></i><span>Clientes</span></a><a><i data-lucide="package"></i><span>Produtos</span></a></nav>
  <script src="../js/veconi-brand.js"></script><script src="../assets/lucide.min.js"></script>
  <script>
    const params=new URLSearchParams(location.search),screen=params.get('screen')||'inicio',desktop=params.get('desktop')==='1';
    const labels={inicio:['Início','Seu negócio em um só lugar'],vender:['Vender','Nova venda'],produtos:['Produtos','Preços, imagens e estoque'],clientes:['Clientes','Relacionamento que gera vendas'],crm:['CRM','Oportunidades para agir'],campanhas:['Campanhas','Fidelização, pontos e recompensas'],financeiro:['Financeiro','Controle entradas, saídas e contas'],cartoes:['Cartões','Faturas e limites'],historico:['Histórico','Tudo o que aconteceu'],catalogo:['Catálogo online','Sua loja na internet'],pedidos:['Pedidos online','Acompanhe cada etapa'],planos:['Planos','Escolha o melhor para o seu negócio'],configuracoes:['Configurações','Conta, equipe e preferências'],drawer:['Início','Menu principal']};
    const icons={inicio:'house',vender:'shopping-bag',produtos:'package',clientes:'users',crm:'contact-round',campanhas:'megaphone',financeiro:'wallet-cards',cartoes:'credit-card',historico:'history',catalogo:'shopping-basket',pedidos:'clipboard-list',planos:'gem',configuracoes:'settings'};
    const nav=Object.keys(icons).map(key=>`<a class="${screen===key?'active':''}"><i data-lucide="${icons[key]}"></i>${labels[key][0]}</a>`).join('');document.querySelector('#qa-nav').innerHTML=nav;document.querySelector('#qa-mobile-nav').innerHTML=`<span class="mobile-nav-section">Módulos</span>${nav}`;
    const row=(icon,title,meta,value='',status='')=>`<article class="qa-row"><i><span data-lucide="${icon}"></span></i><div><b>${title}</b><small>${meta}</small></div>${status?`<span class="qa-status ${status==='Pendente'?'warning':''}">${status}</span>`:`<strong class="qa-value">${value}</strong>`}</article>`;
    const panel=(title,body,wide=false)=>`<section class="qa-panel ${wide?'qa-wide':''}"><header><h3>${title}</h3><button class="btn btn-light btn-sm">Ver todos</button></header><div class="qa-list">${body}</div></section>`;
    const kpis=(items)=>`<section class="qa-kpis">${items.map(([icon,label,value,meta])=>`<article class="qa-kpi"><span><i data-lucide="${icon}"></i></span><b>${value}</b><small>${label}${meta?` · ${meta}`:''}</small></article>`).join('')}</section>`;
    const products=()=>`<section class="qa-products">${[['BR','Brownie','R$ 10,00'],['MO','Monsters','R$ 13,00'],['CR','Cone recheado','R$ 12,00'],['CZ','Coca zero 220ml','R$ 3,50'],['IP','IPTV','R$ 25,90'],['PO','Poty 220ml','R$ 3,50']].map(([initial,name,price])=>`<article class="qa-product"><div class="photo">${initial}</div><b>${name}</b><small>Em estoque</small><strong>${price}</strong><button aria-label="Adicionar">+</button></article>`).join('')}</section>`;
    const page=(title,description,content)=>`<section class="qa-page"><header class="qa-heading"><div><h2>${title}</h2><p>${description}</p></div><button class="btn btn-primary"><i data-lucide="plus"></i> Nova ação</button></header>${content}<footer class="qa-brand-note"><img src="../assets/veconi-symbol.svg" alt=""> VECONI · Seu negócio mais completo.</footer></section>`;
    function content(){
      if(screen==='inicio')return page('Visão geral','Acompanhe hoje e decida com clareza.',kpis([['banknote','Vendas hoje','R$ 1.280,00','12 vendas'],['users','Clientes ativos','128','+8 este mês'],['package','Produtos','42','5 com estoque baixo'],['wallet','A receber','R$ 820,00','6 clientes']])+`<div class="qa-grid">${panel('Próximas contas',row('house','Aluguel','Casa · 10/09','R$ 1.500')+row('zap','Energia','Casa · 15/09','R$ 320'),true)}${panel('Ações rápidas',row('shopping-bag','Nova venda','Registrar recebimento')+row('user-plus','Novo cliente','Adicionar contato'))}</div>`);
      if(screen==='vender')return page('Nova venda','Busque produtos e monte o pedido.',`<div class="qa-toolbar"><input class="search" placeholder="Buscar produto ou código"><button class="btn btn-light"><i data-lucide="scan-line"></i> Escanear</button></div><div class="qa-grid"><section class="qa-wide">${products()}</section>${panel('Venda atual',row('minus','Brownie','2 unidades','R$ 20,00')+row('minus','Monster','1 unidade','R$ 13,00')+row('badge-dollar-sign','Total','Pagamento à vista','R$ 33,00'))}</div>`);
      if(screen==='produtos')return page('Produtos','Preços, imagens e estoque.',`<div class="qa-toolbar"><input class="search" placeholder="Buscar produto por nome ou código"><button class="btn btn-primary">Novo produto</button></div>${products()}`);
      if(screen==='clientes')return page('Clientes','Relacionamento que gera vendas.',`<div class="qa-toolbar"><input class="search" placeholder="Buscar cliente"><button class="btn btn-primary">Novo cliente</button></div><div class="qa-grid">${panel('Todos os clientes',row('user','Beatriz Maze','Última compra hoje','R$ 420')+row('user','Kaique Silva','Cliente recorrente','R$ 350')+row('user','Jéssica Arezzo','Sem saldo em aberto','R$ 180'),true)}${panel('Resumo',row('users','Ativos','Clientes que compram','128')+row('wallet','A receber','Saldo em aberto','R$ 820'))}</div>`);
      if(screen==='crm')return page('CRM','Encontre oportunidades e aja no momento certo.',kpis([['clock','Sumidos há 30 dias','18','clientes'],['calendar','Renovações em 7 dias','8','clientes'],['star','Clientes VIP','12','clientes'],['gift','Perto da recompensa','6','clientes']])+`<div class="qa-grid">${panel('Segmentos prontos',row('timer-reset','Clientes para reativar','Sem comprar há 30 dias','18')+row('sparkles','Melhores clientes','Mais compradores','12'),true)}${panel('Ações',row('message-circle','Enviar mensagem','WhatsApp')+row('megaphone','Criar campanha','Com este grupo'))}</div>`);
      if(screen==='campanhas')return page('Campanhas','Fidelização, pontos e recompensas.',kpis([['users','Elegíveis','128','clientes'],['activity','Com progresso','32','clientes'],['gift','Prêmios','8','a entregar'],['check-circle','Resgates','15','concluídos']])+`<div class="qa-grid">${panel('Campanhas ativas',row('shopping-cart','Programa de pontos','Todos os clientes','Ativa','Ativa')+row('gift','Compre 5 e ganhe 1','Brownie','Ativa','Ativa')+row('badge-percent','Leve mais e pague menos','Programada','','Pendente'),true)}${panel('Próxima ação',row('plus','Nova campanha','Wizard em 5 etapas')+row('chart-no-axes-combined','Acompanhar','Resultados e resgates'))}</div>`);
      if(screen==='financeiro')return page('Financeiro','Acompanhe suas finanças em tempo real.',kpis([['arrow-up','Entradas','R$ 12.480,00','+12%'],['arrow-down','Saídas','R$ 7.320,50','-8%'],['chart-no-axes-combined','Resultado','R$ 5.159,50','+28%'],['wallet','A receber','R$ 2.480,00','5 contas']])+`<div class="qa-tabs"><button class="active">Visão geral</button><button>Contas</button><button>Cartões</button><button>Fluxo</button></div><div class="qa-grid">${panel('Próximas contas',row('house','Aluguel','Casa · 10/09','R$ 1.500')+row('credit-card','Fatura C6 Carbon','Cartão · 13/09','R$ 1.487')+row('zap','Energia','Casa · 15/09','R$ 320'),true)}${panel('Lançamentos',row('arrow-up','Pagamento de Beatriz','PIX · Automático','R$ 63,50')+row('arrow-down','Mercadoria','Estoque','R$ 480'))}</div>`);
      if(screen==='cartoes')return page('Cartões','Faturas, limites e compras.',kpis([['credit-card','Fatura atual','R$ 1.487,35','C6 Carbon'],['calendar','Fecha em','5 dias','08/09'],['wallet','Limite disponível','R$ 6.512,65','de R$ 8.000'],['receipt','Compras','14','nesta fatura']])+`<div class="qa-grid">${panel('C6 Carbon •••• 2429',row('shopping-bag','Mercado','Alimentação · hoje','R$ 248')+row('badge-dollar-sign','Meta Ads','Marketing · ontem','R$ 320'),true)}${panel('Próximas faturas',row('calendar','Setembro','Vence dia 13','R$ 1.487')+row('calendar','Outubro','Em aberto','R$ 220'))}</div>`);
      if(screen==='historico')return page('Histórico','Vendas, pagamentos e alterações.',`<div class="qa-toolbar"><input class="search" placeholder="Buscar no histórico"><button class="btn btn-light">Filtros</button></div>${panel('Hoje',row('banknote','Pagamento recebido','Beatriz Maze · PIX','R$ 63,50')+row('shopping-bag','Venda concluída','3 itens · Dinheiro','R$ 42,00')+row('package-plus','Entrada de estoque','Monster · 12 unidades','12 un.'),true)}`);
      if(screen==='catalogo')return page('Catálogo online','Preserve a identidade da loja e venda pela internet.',`<section class="qa-hero"><div><small>CATÁLOGO ADI FESTA</small><h3>Olá! Veja o que está disponível.</h3><p>Retirada disponível · pedidos online ativos.</p></div><img src="../assets/veconi-symbol.svg" alt=""></section>${products()}`);
      if(screen==='pedidos')return page('Pedidos online','Cada pedido mostra a próxima ação.',`<div class="qa-tabs"><button class="active">Todos</button><button>Recebidos</button><button>Em preparo</button><button>Prontos</button></div><div class="qa-grid">${panel('Pedidos novos',row('shopping-bag','#1024 · Jéssica Kings','2 itens · há 4 min','R$ 62')+row('shopping-bag','#1023 · Marcos Paulo','1 item · há 11 min','R$ 35,50'),true)}${panel('Em preparo',row('package-check','#1022 · Ana Clara','3 itens','R$ 47,80'))}</div>`);
      if(screen==='planos')return page('Planos VECONI','Escolha os recursos certos para crescer.',`<section class="qa-grid">${[['Essencial','R$ 29,90','Organize o básico'],['Profissional','R$ 49,90','Venda e cresça','recommended'],['Premium','R$ 79,90','Tenha o máximo']].map(([name,price,meta,cls])=>`<article class="qa-panel ${cls||''}" style="padding:22px"><span class="qa-status">VECONI</span><h3 style="font-size:22px">${name}</h3><b style="font-size:29px;color:#087f75">${price}<small style="font-size:12px;color:#758195"> / mês</small></b><p style="color:#758195">${meta}</p><button class="btn ${cls?'btn-primary':'btn-light'}" style="width:100%">Escolher plano</button></article>`).join('')}</section>`);
      return page('Configurações','Conta, equipe, nuvem e preferências.',`<div class="qa-grid">${panel('Seu negócio',row('store','Adi Festa','Nome e contato')+row('users','Equipe','Usuários e permissões'),true)}${panel('Sistema',row('cloud','Nuvem','Sincronizado')+row('bell','Notificações','Ativas'))}${panel('Segurança',row('shield-check','Conta protegida','Firebase Auth')+row('download','Exportar dados','Backup JSON'))}</div>`);
    }
    document.querySelector('#title').textContent=labels[screen]?.[0]||'VECONI';document.querySelector('#subtitle').textContent=labels[screen]?.[1]||'Seu negócio mais completo.';document.querySelector('#app').innerHTML=content();if(screen==='drawer'){document.body.classList.add('qa-drawer-demo');document.querySelector('#sidebar').classList.add('open')}if(screen==='login'){document.body.innerHTML=`<main class="qa-login-wrap"><section class="auth-card">${VeconiBrand.markup({mode:'stacked',tagline:true})}<h1>Bem-vindo</h1><p>Acesse seu negócio com segurança.</p><form><label>E-mail<input value="murillo@exemplo.com"></label><label>Senha<input type="password" value="12345678"></label><button class="btn btn-primary">Entrar</button><button class="btn btn-light" type="button">Criar minha conta</button></form></section></main>`}VeconiBrand.hydrate(document);lucide.createIcons();document.documentElement.dataset.ready='true';
  </script>
</body>
</html>
