<details class="qa-tools"><summary>Laboratório QA · Cenários fictícios</summary><nav class="qa-toolbar" aria-label="Cenários fictícios"><button id="qa-editor" type="button">Gestor</button><button id="qa-daily" type="button">Só hoje</button><button id="qa-history" type="button">Com histórico</button><button id="qa-none" type="button">Sem indicadores</button><button id="qa-owner" type="button">Proprietário</button><label>Prontidão QA <select id="qa-readiness"><option value="1">Piloto fictício preparado</option><option value="0">Etapa de segurança pendente</option></select></label><output id="qa-effects">Dados fictícios · sem Firebase · 0 gravações reais</output></nav></details>

<script src="../js/veconi-brand.js"></script><script src="../tests/fixtures/performance-v224.js"></script><script src="../assets/lucide.min.js"></script><script src="../functions/src/shared/permission-policy.js"></script><script src="../functions/src/shared/operational-privacy-policy.js"></script><script src="../js/team-access.js"></script><script src="../js/team-permission-model.js"></script><script src="../js/team-permission-editor.js"></script><script src="../js/performance-access.js"></script><script src="../js/desktop-dashboard.js"></script><script src="../js/home-mobile.js"></script>
<script>
(() => {
 const original=structuredClone(qaV224.data),seller={...structuredClone(qaV224.seller),name:'Ana Lima · QA'},stock={...structuredClone(qaV224.seller),uid:'qa-stock',name:'Bruno Souza · QA',role:'stock',permissions:{'products.view':true,'inventory.view':true}},owner={...qaV224.owner,name:'Proprietário · QA'};
 const records=[seller,stock],ui=window.qaPermissionsUI={failNext:false,mode:'editor',writes:[],original};
 SpaceContext.homeSpaces=()=>[{id:'qa-a',businessId:'qa-business',name:'Loja Centro'},{id:'qa-b',businessId:'qa-business',name:'Loja Bairro'},{id:'foreign',businessId:'other-business',name:'Empresa externa QA'}];
 const buttons=['editor','daily','history','none','owner'];
 function activate(mode){ui.mode=mode;buttons.forEach(id=>document.querySelector('#qa-'+id).setAttribute('aria-pressed',String(id===mode)));}
 function manager(){qaV224.change({role:'owner',member:qaV224.owner,userProfile:{uid:'qa-owner',businessId:'qa-business',active:true},permissions:['*'],spaceAccess:'all',allowedSpaceIds:[],business:{...qaV224.context().business,operationalReadPolicyVersion:Number(document.querySelector('#qa-readiness').value)}});}
 function roster(){manager();document.querySelector('#app').innerHTML='<section class="qa-roster"><h1>Equipe QA</h1><p>Escolha um cadastro fictício para revisar os acessos.</p>'+records.map((r,i)=>'<button type="button" data-qa-member="'+i+'">'+r.name+' · '+r.role+'</button>').join('')+'</section>';document.querySelectorAll('[data-qa-member]').forEach(b=>b.onclick=()=>editor(records[Number(b.dataset.qaMember)]));}
 function editor(member=seller){manager();activate('editor');TeamPermissionEditor.open(member,{onClose:roster});}
 function dashboard(mode){activate(mode);const member=mode==='owner'?owner:{...seller,permissions:{...seller.permissions,'performance.daily':mode!=='none','performance.history':mode==='history'}};qaV224.change({role:member.role,member,userProfile:{uid:member.uid,businessId:'qa-business',active:true},permissions:member.role==='owner'?['*']:Object.keys(member.permissions).filter(k=>member.permissions[k]),spaceAccess:member.spaceAccess,allowedSpaceIds:member.allowedSpaceIds});document.querySelector('#app').innerHTML=PerformanceAccess.restricted()?PerformanceAccess.render():DesktopDashboard.render();(PerformanceAccess.restricted()?PerformanceAccess:DesktopDashboard).bind();lucide.createIcons();}
 TeamService.updateMember=async(uid,payload)=>{if(qaV224.context().role!=='owner')throw Error('Somente o gestor QA pode confirmar.');await new Promise(r=>setTimeout(r,120));if(ui.failNext){ui.failNext=false;throw Error('Não foi possível salvar agora. As escolhas foram preservadas.');}if(OperationalPrivacyPolicy.restricted(payload)&&!OperationalPrivacyPolicy.restricted(payload.expectedAccess)&&qaV224.context().business.operationalReadPolicyVersion!==1)throw Error('A etapa de segurança ainda está pendente. Nenhum acesso foi alterado.');ui.writes.push({uid,payload:structuredClone(payload)});document.querySelector('#qa-effects').textContent=ui.writes.length+' confirmação fictícia · 0 gravações reais';return{member:{uid,...payload}};};
 document.querySelector('#qa-editor').onclick=()=>editor();document.querySelector('#qa-owner').onclick=()=>dashboard('owner');for(const mode of ['daily','history','none'])document.querySelector('#qa-'+mode).onclick=()=>dashboard(mode);
 document.querySelector('#qa-readiness').onchange=()=>editor();ui.editor=editor;ui.roster=roster;ui.dashboard=dashboard;editor();
})();
</script></body></html>
