<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    />

    <style>
      body {
        background: #fbfcfe;
      }
      .fixture-shell {
        min-height: 100dvh;
      }
      .fixture-topbar {
        height: 82px;
        padding: env(safe-area-inset-top) 16px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        border-bottom: 1px solid #e6e9ef;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .fixture-topbar button {
        border: 0;
        background: none;
        color: #0b1538;
      }
      .fixture-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #0b1538;
      }
      .fixture-brand i {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: #e8faf3;
        color: #0aa875;
        display: grid;
        place-items: center;
      }
      .fixture-brand b {
        font-size: 18px;
      }
      .fixture-brand small {
        display: block;
        color: #0aa875;
        letter-spacing: 4px;
        font-size: 8px;
      }
      .fixture-main {
        padding: 18px 14px 95px;
        max-width: 1120px;
        margin: auto;
      }
      .fixture-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 72px;
        padding-bottom: env(safe-area-inset-bottom);
        display: flex;
        align-items: center;
        justify-content: space-around;
        background: #fff;
        border-top: 1px solid #e2e6ed;
        z-index: 12;
      }
      .fixture-nav span {
        display: grid;
        justify-items: center;
        gap: 3px;
        font-size: 9px;
        color: #657088;
      }
      .fixture-nav span:first-child {
        color: #09a471;
      }
      .fixture-nav svg {
        width: 20px;
      }
      .coupon-editor .modal-head h3 {
        margin: 0;
      }
      .coupon-editor .modal-head small {
        color: #697386;
      }
    </style>
  </head>

      const coupons = [

    <script src="../js/activity-center.js"></script>
    <script src="../js/configuracoes-mobile.js"></script>
    <script src="../js/plans.js"></script>
    <script src="../js/coupons-admin.js"></script>
    <script>
      window.__mobilePart4Ready = "starting";
      window.__mobilePart4Audit = () => ({ phase: "starting" });
      (async () => {
        const state =
            new URLSearchParams(location.search).get("state") || "history",
          app = document.querySelector("#app");
        if (state.startsWith("history")) {
          app.innerHTML = ActivityCenter.render();
          ActivityCenter.bind();
          if (state === "history-filter")
            document.querySelector("[data-history-filters]").click();
          if (state === "history-sale")
            document.querySelector('[data-activity-id="movement:m1"]').click();
        } else if (state === "settings") {
          app.innerHTML = ConfiguracoesMobile.render();
          ConfiguracoesMobile.bind();
        } else if (state.startsWith("plan-")) {
          window.FirebaseSession = {};
          if (state === "plan-trial") fixtureContext = { ...fixtureContext };
          if (state === "plan-paid")
            fixtureContext = {
              ...fixtureContext,
              subscription: {
                planId: "professional",
                status: "active",
                currentPeriodEnd: iso(20 * 86400000),
              },
              access: {
                status: "active",
                readOnly: false,
                limits: basePlans[1].limits,
              },
              business: { id: "demo", limits: basePlans[1].limits },
            };
          if (state === "plan-expired")
            fixtureContext = {
              ...fixtureContext,
              subscription: {
                planId: "trial",
                status: "expired",
                trialStartedAt: iso(-10 * 86400000),
                trialEndsAt: iso(-3 * 86400000),
              },
              access: {
                status: "expired",
                readOnly: true,
                limits: basePlans[0].limits,
              },
              business: { id: "demo", limits: basePlans[0].limits },
            };
          app.innerHTML = PlansUI.render();
          PlansUI.bind(app);
        } else {
          app.innerHTML = CouponsAdmin.render();
          CouponsAdmin.bind();
          await new Promise((r) => setTimeout(r, 30));
          if (state === "coupon-new")
            document.querySelector("[data-new-coupon]").click();
          if (state === "coupon-edit")
            document.querySelector("[data-coupon-edit]").click();
          await new Promise((r) => setTimeout(r, 30));
        }
        window.__mobilePart4Ready = true;
        window.__mobilePart4Audit = () => {
          const visible = (e) => {
              const s = getComputedStyle(e),
                r = e.getBoundingClientRect();
              return (
                s.display !== "none" &&
                s.visibility !== "hidden" &&
                r.width > 1 &&
                r.height > 1
              );
            },
            rails =
              ".activity-chips,.plan-offers,.coupon-kpis,.coupon-filters,.coupon-card footer";
          const offenders = [...document.body.querySelectorAll("*")]
              .filter((e) => {
                if (!visible(e) || e.closest(rails)) return false;
                const r = e.getBoundingClientRect();
                return r.left < -1 || r.right > innerWidth + 1;
              })
              .slice(0, 20)
              .map((e) => {
                const r = e.getBoundingClientRect();
                return {
                  tag: e.tagName.toLowerCase(),
                  class: String(e.className || "").slice(0, 90),
                  left: Math.round(r.left * 10) / 10,
                  right: Math.round(r.right * 10) / 10,
                  width: Math.round(r.width * 10) / 10,
                };
              }),
            modal = document.querySelector("#modal .modal-box"),
            mr = modal?.getBoundingClientRect();
          return {
            state,
            width: innerWidth,
            height: innerHeight,
            clientWidth: document.documentElement.clientWidth,
            scrollWidth: document.documentElement.scrollWidth,
            overflow:
              document.documentElement.scrollWidth >
              document.documentElement.clientWidth + 1,
            offenders,
            modal: mr
              ? {
                  left: mr.left,
                  right: mr.right,
                  top: mr.top,
                  bottom: mr.bottom,
                  width: mr.width,
                  height: mr.height,
                }
              : null,
            rawFileInputs: [
              ...document.querySelectorAll("input[type=file]"),
            ].filter(visible).length,
            rawCheckboxes: [
              ...document.querySelectorAll("input[type=checkbox]"),
            ].filter(
              (e) => visible(e) && getComputedStyle(e).appearance !== "none",
            ).length,
          };
        };
        window.lucide?.createIcons();
      })();
    </script>
    <script>
      addEventListener(
        "unhandledrejection",
        (event) =>
          (window.__mobilePart4Error =
            event.reason?.stack ||
            event.reason?.message ||
            String(event.reason)),
      );
      addEventListener(
        "error",
        (event) =>
          (window.__mobilePart4Error = event.error?.stack || event.message),
      );
      addEventListener("load", () => setTimeout(() => scrollTo(0, 0), 160));
    </script>

</html>
