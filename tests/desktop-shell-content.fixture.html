  <script>
    window.__desktopAuditErrors = [];
    window.__fixtureLoadCount = Number(sessionStorage.getItem("desktopFixtureLoads") || 0) + 1;
    sessionStorage.setItem("desktopFixtureLoads", String(window.__fixtureLoadCount));
    addEventListener("error", event => window.__desktopAuditErrors.push({ type: "error", message: event.message, stack: event.error?.stack || "" }));
    addEventListener("unhandledrejection", event => window.__desktopAuditErrors.push({ type: "rejection", message: event.reason?.message || String(event.reason), stack: event.reason?.stack || "" }));

  <script>
    const now = Date.now(), iso = days => new Date(now - days * 86400000).toISOString();
    DB.useBusiness("desktop-shell-fixture");
    DB.alterar(data => {
      data.config.nome = "Empresa fixture";
      data.config.operation = { operationMode: "physical_store", creditMode: "enabled", operationOnboardingCompleted: true, modules: { inventory: true, crm: true, creditSales: true } };
      data.produtos = [{ id: "p1", nome: "Cone", preco: 12, estoqueAtual: 8, estoqueMinimo: 3, ativo: true }];
      data.clientes = [{ id: "c1", nome: "Ana", telefone: "17999999999", saldo: -20, ativo: true, totalComprado: 100, quantidadeVendas: 2, ultimaCompra: iso(2), criadoEm: iso(30) }];
      data.vendas = [{ id: "v1", clienteId: "c1", clienteNome: "Ana", data: iso(1), valorFinal: 50, lucro: 20, status: "pago", itens: [{ produtoId: "p1", nome: "Cone", quantidade: 2, subtotalFinal: 50 }] }];
      data.pagamentos = [{ id: "pg1", clienteId: "c1", data: iso(1), valor: 20 }];
      data.campanhas = []; data.progressosCampanha = []; data.recompensas = []; data.catalogOrders = [];
    });
    window.FirebaseSession = { user: { uid: "fixture-owner", email: "owner@fixture.local" }, profile: { role: "owner", active: true, businessId: "desktop-shell-fixture" }, businessId: "desktop-shell-fixture", business: { id: "desktop-shell-fixture", name: "Empresa fixture" }, access: { planId: "internal", readOnly: false, limits: {} } };
    window.SyncFirebase = { setScreen() {}, subscribe() { return () => {}; } };
    window.FirebaseAuthActions = { signOut() {} };
  </script>
  <script src="../js/app.js"></script>
  <script src="../js/client-cloud-pagination.js"></script>
  <script src="../js/mobile-navigation-gesture.js"></script>
  <script src="../js/mobile-navigation.js"></script>
  <script src="../js/home-mobile.js"></script>
  <script>
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
    function snapshot(route) {
      const app = document.querySelector("#app"), dashboard = document.querySelector("[data-desktop-dashboard]"), style = getComputedStyle(app), rect = app.getBoundingClientRect(), center = document.elementFromPoint(innerWidth / 2, Math.min(innerHeight - 1, 220));
      const db = DB.carregar();
      return { route, actualRoute: app.dataset.route || null, width: innerWidth, dataCounts: { clients: db.clientes?.length || 0, products: db.produtos?.length || 0, sales: db.vendas?.length || 0 }, appChildren: app.children.length, appHtmlLength: app.innerHTML.length, appDisplay: style.display, appVisibility: style.visibility, appOpacity: style.opacity, appPointerEvents: style.pointerEvents, appRect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height }, dashboard: Boolean(dashboard), dashboardDisplay: dashboard ? getComputedStyle(dashboard).display : null, recovery: Boolean(app.querySelector('.boot-recovery')), centerElement: center ? `${center.tagName.toLowerCase()}${center.id ? `#${center.id}` : ""}.${[...center.classList].join(".")}` : null, pageInstance: app.dataset.pageInstance || null };
    }
    async function runAudit() {
      dispatchEvent(new CustomEvent("firebase-auth-ready", { detail: { uid: "fixture-owner", businessId: "desktop-shell-fixture" } }));
      await delay(120);
      const results = [snapshot("inicio")];
      if (new URLSearchParams(location.search).has("single")) {
        const output = document.createElement("pre"); output.id = "desktop-browser-audit"; output.style.cssText = "position:fixed;inset:10px;z-index:99999;background:white;color:black;overflow:auto;white-space:pre-wrap;font-size:11px"; output.textContent = JSON.stringify({ results, errors: window.__desktopAuditErrors }); document.body.append(output); return;
      }
      for (const route of ["clientes", "produtos", "crm", "configuracoes", "inicio"]) {
        document.querySelector(`.desktop-sidebar-nav [data-route="${route}"]`)?.click(); await delay(100); results.push(snapshot(route));
      }
      const output = document.createElement("pre"); output.id = "desktop-browser-audit"; output.style.cssText = "position:fixed;inset:10px;z-index:99999;background:white;color:black;overflow:auto;white-space:pre-wrap;font-size:11px"; output.textContent = JSON.stringify({ results, errors: window.__desktopAuditErrors }); document.body.append(output);
    }
    runAudit();
  </script>
