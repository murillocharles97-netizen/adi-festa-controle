<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VECONI · QA isolado de evidências V212</title>
<link rel="stylesheet" href="../../css/sale-monetary-analysis.css"><style>body{font:16px system-ui;margin:0;background:#f5f7fa;color:#123}header,main{padding:20px;max-width:850px;margin:auto}button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #aac;cursor:pointer}.btn-primary{background:#00bdb3;color:#003633;border:none}#qa-summary{white-space:pre-wrap}</style>
<header><h1>QA isolado · Coleta de evidências</h1><p>Somente dados fictícios neste localhost. Sem Firebase, sem Sync comercial.</p><label>Cenário <select id="scenario"><option value="owner">Owner / dois originais</option><option value="missing">Originais ausentes</option><option value="offline">Falha de rede</option><option value="seller">Seller sem acesso</option></select></label> <button id="apply">Preparar cenário QA</button> <button id="online">Restaurar rede QA</button><p id="qa-summary" role="status"></p></header><main></main><div id="modal"></div>
<script src="../../js/sale-monetary-analysis-client.js"></script><script>
// Harness belongs ONLY to tests, not the publication allowlist. Local QA origin.
(async()=>{if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('QA loopback only');
const uid='qa-analysis-owner',businessId='qa-analysis-business',spaceId='qa-analysis-space',scope=`business-cache:v156:adiFestaDB_v1:${businessId}:${uid}:fixture`,queue=`adiFesta:${businessId}:${uid}:fixture:syncQueue`;
const targets=[0,1].map(n=>({saleId:'qa-analysis-sale-'+n,operationId:'qa-analysis-operation-'+n,spaceId,movementIds:['qa-move-'+n]})),receipts=new Map();let offline=false,uploads=0;
const request=indexedDB.open('veconi-local-records',1);request.onupgradeneeded=()=>request.result.createObjectStore('records',{keyPath:'key'}).createIndex('scope','scope');const db=await new Promise((r,j)=>{request.onsuccess=()=>r(request.result);request.onerror=()=>j(request.error);});
const original=t=>{const sale={id:t.saleId,operationId:t.operationId,businessId,spaceId,actorUid:uid,data:'2026-10-26T19:57:00Z',valorFinal:9.9999,formaPagamento:'pix',itens:[{produtoId:'qa-product',quantidade:3,precoFinalUnitario:3.3333}]};return{operationId:t.operationId,businessId,userId:uid,workspaceGeneration:0,status:'error',lastErrorCode:'invalid-argument',lastErrorMessage:'Total não corresponde aos itens.',payloadVersion:4,attempts:1,payload:{writes:[{entityType:'sales',entityId:t.saleId,operation:'create',data:sale}]}};};
let current={businessId,role:'owner',business:{workspaceGeneration:0},member:{status:'active'},userProfile:{uid,active:true}};
window.FirebaseSession={user:{uid}};window.BusinessContext={get:()=>current};window.SpaceContext={homeId:()=>spaceId};window.SyncFirebase={checksumValue:()=>null};window.DB={getBusinessId:()=>businessId,getWorkspaceGeneration:()=>0,getPrincipal:()=>uid,businessCache:{ready:()=>true,pending:()=>false},localRecords:{read:async()=>({workspaceGeneration:0}),transaction:(mode,fn)=>new Promise((resolve,reject)=>{if(mode!=='readonly')throw Error('Forbidden');const tx=db.transaction('records',mode);let result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);fn(tx.objectStore('records'),v=>result=v,e=>{reject(e);tx.abort();});})}};
const summary=()=>document.querySelector('#qa-summary').textContent=`Uploads de evidências: ${uploads}\nRecibos privados: ${receipts.size}\nVendas/estoque/pagamentos/filas alterados: 0`;
window.FirebaseCallable=async(name,data)=>{if(name==='listSaleRecoveryReviews')return{kind:'monetary_analysis_v1',schemaVersion:1,eligible:true,intakeEnabled:true,targets,items:[...receipts.values()]};if(name!=='submitSaleRecovery')throw Error('Forbidden commercial callable');if(offline)throw Object.assign(Error('QA offline'),{code:'unavailable'});const o=JSON.parse(data.originalJson),t=targets.find(t=>t.operationId===o.packet.operationId),duplicate=receipts.has(t.operationId),r={kind:'monetary_analysis_v1',schemaVersion:1,businessId,actorUid:uid,spaceId,workspaceGeneration:0,saleId:t.saleId,operationId:t.operationId,contentHash:data.contentHash,status:'analysis_received',commercialEffectsApplied:false};receipts.set(t.operationId,r);uploads++;summary();return{...r,duplicate};};
async function prepare(){const scenario=document.querySelector('#scenario').value;receipts.clear();uploads=0;offline=scenario==='offline';current={...current,role:scenario==='seller'?'seller':'owner'};const tx=db.transaction('records','readwrite'),store=tx.objectStore('records');store.clear();if(scenario!=='missing')targets.forEach((t,n)=>store.put({key:JSON.stringify([scope,'sync',queue,t.operationId,0]),scope,area:'sync',field:queue,kind:'item',position:n,value:original(t)}));await new Promise(r=>tx.oncomplete=r);document.querySelector('main').replaceChildren();dispatchEvent(new Event('firebase-session-cleared'));dispatchEvent(new Event('business-context-changed'));summary();}
document.querySelector('#apply').onclick=prepare;document.querySelector('#online').onclick=()=>{offline=false;summary();};await prepare();await import('../../js/sale-monetary-analysis-ui.js');
})();</script></html>
