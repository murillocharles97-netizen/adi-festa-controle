<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QA · Recibo extenso</title><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/receipt.css"><link rel="stylesheet" href="../../css/sale-completion.css"><link rel="stylesheet" href="../../css/mobile-fixes.css"><link rel="stylesheet" href="../../css/sale-exchanges.css"><style>body{margin:0;background:#edf4f5;font-family:system-ui;color:#23414a}main{padding:32px;max-width:1100px;margin:auto}main button{margin:5px}.qa-label{color:#07766b;font-size:13px}.qa-brand{font-size:23px;font-weight:750;letter-spacing:2px}.qa-brand span{color:#008c83}#modal .viewport-dialog .viewport-scroll{scrollbar-color:#92b5b2 transparent}</style></head><body><main><div class="qa-brand"><span>V</span>ECONI</div><p class="qa-label">Laboratório local · dados totalmente fictícios · sem conexão com produção</p><h1>Histórico / Venda QA</h1><p>Recibo extenso com 45 itens. Nenhuma venda é executada.</p><button class="btn btn-primary" id="show-receipt">Abrir venda concluída</button><button class="btn btn-light" id="show-cancel">Abrir cancelamento</button><button class="btn btn-light" id="show-exchange">Abrir troca</button></main><div id="modal"></div>
<script>
const sale={id:'qa-receipt-long',businessId:'qa-ux-business',spaceId:'qa-ux-space',clienteId:'qa-customer',clienteNome:'Cliente fictício QA',data:'2026-10-25T15:10:00Z',status:'pago',formaPagamento:'pix',valorFinal:450,valorTotal:450,itens:Array.from({length:45},(_,n)=>({produtoId:'qa-product-'+n,nome:`Produto fictício ${String(n+1).padStart(2,'0')} — variação de demonstração`,quantidade:1,precoUnitario:10,precoFinalUnitario:10})),observacao:'Demonstração de recibo extenso, sem efeitos comerciais.'};
window.qaOriginal=JSON.stringify(sale);window.qaCalls=[];
window.qaOpenUrls=[];window.open=url=>{qaOpenUrls.push(url);return null;};
window.Utils={dinheiro:n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),escapar:v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),toast:()=>{}};
window.Router={ir:()=>{}};window.FirebaseSession={user:{uid:'qa-ux-owner'},business:{name:'Loja demonstração'}};
window.DB={carregar:()=>({config:{nome:'Loja demonstração'},vendas:[sale],produtos:[{id:'qa-product-0',nome:'Produto fictício 01',preco:10,estoqueAtual:10}]}),getBusinessId:()=>sale.businessId,getWorkspaceGeneration:()=>0};
window.TeamAccess={has:()=>true};window.SpaceContext={homeId:()=>sale.spaceId};
window.SyncFirebase={isSalePending:()=>false,getFirebaseDiagnostic:()=>({pending:0,syncErrors:0})};
window.FirebaseCallable=async(name,data)=>{qaCalls.push({name,data});if(name==='previewSaleCancellation')return {saleId:sale.id,spaceId:sale.spaceId,operationId:'qa-only-preview',fingerprint:'qa-preview',amountCents:45000,isCredit:false};if(name==='listSaleExchanges')return {items:[],remainingQuantities:sale.itens.map(()=>1)};throw Error('Este laboratório não confirma operações comerciais.');};
</script><script src="../../assets/lucide.min.js"></script><script src="../../js/recibos.js"></script><script src="../../js/sale-cancellation.js"></script><script src="../../js/sale-exchanges.js"></script><script>
window.qaOpen=kind=>kind==='cancel'?SaleCancellation.open(sale.id):kind==='exchange'?SaleExchanges.open(sale):Recibos.mostrar(sale,{nome:sale.clienteNome,telefone:'11900000000'});
document.querySelector('#show-receipt').onclick=()=>qaOpen('receipt');document.querySelector('#show-cancel').onclick=()=>qaOpen('cancel');document.querySelector('#show-exchange').onclick=()=>qaOpen('exchange');
window.fixtureReady=Promise.resolve(qaOpen(new URLSearchParams(location.search).get('kind')));
</script></body></html>
