<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trocas V1 · prévia QA local</title><link rel="stylesheet" href="../../css/sale-exchanges.css?v=194local"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#f0f6f6;color:#143b40}button,input,select,textarea{font:inherit}button{cursor:pointer}.fixture-top{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 40px;background:#082a31;color:white}.fixture-logo{font-size:24px;letter-spacing:-.8px;font-weight:750}.fixture-logo span{color:#06d7c1;margin-right:10px}.fixture-user{font-size:13px}main{max-width:1050px;margin:40px auto;padding:20px}.fixture-card{background:white;border:1px solid #dae7e4;padding:24px;border-radius:20px;margin:20px 0}.fixture-card button{background:#008a7f;color:white;border:0;border-radius:10px;padding:12px 18px;margin:4px}.fixture-card p{color:#58777d}.fixture-chip{padding:5px 10px;background:#e4f5ed;color:#08755a;border-radius:30px;font-size:12px}.modal-bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a253a99;backdrop-filter:blur(4px)}[data-fixture-mode]{max-width:270px;border:1px solid #c0d7d3;padding:10px;border-radius:9px;background:white}body.fixture-empty .fixture-card{max-width:760px}@media(max-width:520px){.modal-bg{align-items:flex-end}.fixture-top{padding:0 20px}.fixture-user{display:none}main{margin:15px auto;padding:16px}}
</style></head><body><header class="fixture-top"><div class="fixture-logo"><span>Ⅴ</span>VECONI</div><span class="fixture-user">QA Beleza · Proprietário</span></header><main><span class="fixture-chip">Dados fictícios · ambiente local</span><h1>Histórico</h1><p>Venda #QA-001 · Camila Souza · 21/10/2026, 10:40</p><div class="fixture-card"><h2>Venda concluída</h2><p>2× Creme facial Vitamina C · 1× Batom luminoso / Vermelho</p><p>Valor: R$ 130,00 · Dinheiro</p><label>Simular cenário <select data-fixture-mode><option value="normal">Complemento recebido</option><option value="credit">Crédito de troca</option><option value="equal">Mesmo valor</option><option value="lost">Resposta perdida após confirmar</option><option value="stale">Valores mudaram antes de confirmar</option><option value="fiado">Fiado bloqueado</option></select></label><p><button data-fixture-open>Trocar itens / ver trocas</button></p><p>Prévia independente. Não conecta Firebase nem acessa produção.</p></div></main><div id="modal"></div>
<script>
'use strict';
const sale={id:'qa-sale-original',spaceId:'qa-space',clienteId:'qa-camila',status:'pago',formaPagamento:'dinheiro',valorFinal:130,itens:[{produtoId:'qa-cream',nome:'Creme facial Vitamina C',quantidade:2,precoUnitario:50},{produtoId:'qa-lipstick',variantId:'qa-red',variantName:'Vermelho · 4 g',nome:'Batom luminoso',quantidade:1,precoUnitario:30}]};
const products=[{id:'qa-serum',nome:'Sérum iluminador',preco:80,estoqueAtual:6},{id:'qa-cream',nome:'Creme facial Vitamina C',preco:50,estoqueAtual:4},{id:'qa-lipstick',nome:'Batom luminoso',productType:'variable',preco:30}];
const variants=[{id:'qa-red',parentProductId:'qa-lipstick',displayName:'Vermelho · 4 g',price:30,stock:5},{id:'qa-nude',parentProductId:'qa-lipstick',displayName:'Nude · 4 g',price:30,stock:5}];
window.FirebaseSession={user:{uid:'qa-owner'}};window.TeamAccess={has:()=>true};window.DB={getBusinessId:()=> 'qa-business',getWorkspaceGeneration:()=>0,carregar:()=>({produtos:products,variacoesProdutos:variants})};
window.fixtureCalls=[];window.fixtureExchanges=[];let simulatedFailure=false;
const linePrice=(r)=>{const p=products.find(p=>p.id===r.productId),v=variants.find(v=>v.id===r.variantId);return {name:p.nome,variantName:v?.displayName||'',unitCents:Math.round((v?.price??p.preco)*100)};};
function plan(data){const returns=data.returns.map(r=>{const p=sale.itens[r.line];return {...r,productId:p.produtoId,variantId:p.variantId||null,name:p.nome,variantName:p.variantName||'',unitCents:Math.round(p.precoUnitario*100),totalCents:Math.round(p.precoUnitario*100)*r.quantity};});const replacements=data.replacements.map(r=>{const p=linePrice(r);return {...r,...p,totalCents:p.unitCents*r.quantity};});const returnCents=returns.reduce((sum,i)=>sum+i.totalCents,0),newCents=replacements.reduce((sum,i)=>sum+i.totalCents,0),differenceCents=newCents-returnCents;return {returns,replacements,returnCents,newCents,differenceCents,receivedCents:Math.max(0,differenceCents),creditCents:Math.max(0,-differenceCents),reason:data.reason,paymentMethod:differenceCents>0?data.paymentMethod:null,fingerprint:'qa-fixture-fingerprint'};}
window.FirebaseCallable=async(name,data)=>{
 fixtureCalls.push({name,data});
 if(name==='listSaleExchanges')return {items:fixtureExchanges,remainingQuantities:sale.itens.map((i,line)=>i.quantidade-fixtureExchanges.reduce((sum,e)=>sum+e.returns.filter(r=>r.line===line).reduce((n,r)=>n+r.quantity,0),0))};
 if(name==='quoteSaleExchange'){if(!data.returns.length||!data.replacements.length)throw Error('Selecione itens devolvidos e novos.');return plan(data);}
 if(name==='lookupSaleExchange')return {found:fixtureExchanges.some(x=>x.id===data.operationId),item:fixtureExchanges.find(x=>x.id===data.operationId),retryAllowed:true};
 if(name==='confirmSaleExchange'){
   const existing=fixtureExchanges.find(x=>x.id===data.operationId);if(existing)return {id:existing.id,replayed:true};
   if(document.querySelector('[data-fixture-mode]').value==='stale'&&!simulatedFailure){simulatedFailure=true;throw Object.assign(Error('Estoque ou valores mudaram. Revise novamente.'),{code:'functions/failed-precondition'});}
   fixtureExchanges.push({...plan(data),id:data.operationId,operationId:data.operationId,createdAt:new Date().toISOString(),actorUid:'qa-owner',actorNameSnapshot:'Operador QA'});
   if(document.querySelector('[data-fixture-mode]').value==='lost'&&!simulatedFailure){simulatedFailure=true;throw Object.assign(Error('A resposta foi perdida. Consultando registro...'),{code:'functions/unavailable'});}
   return {id:data.operationId};
 }
 throw Error('Chamada não prevista na prévia QA');
};
async function start(){const mode=document.querySelector('[data-fixture-mode]').value;simulatedFailure=false;await SaleExchanges.open(mode==='fiado'?{...sale,status:'fiado',formaPagamento:'fiado'}:sale);}
document.querySelector('[data-fixture-open]').onclick=start;
</script><script src="../../js/sale-exchanges.js"></script><script>
const params=new URLSearchParams(location.search);if(params.has('case'))document.querySelector('[data-fixture-mode]').value=params.get('case');
window.fixtureReady=(async()=>{await start();if(params.get('stage')==='review'){document.querySelector('[data-return="0"]').value='1';document.querySelector('[data-restock="0"]').checked=true;document.querySelector('[name="reasonType"]').value='Preferência do cliente';const mode=document.querySelector('[data-fixture-mode]').value;document.querySelector('[data-product]').value=mode==='credit'?'2':mode==='equal'?'1':'0';await document.querySelector('[data-ex-form]').onsubmit({preventDefault(){}});}})();
</script></body></html>
