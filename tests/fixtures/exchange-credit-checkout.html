<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crédito de troca · QA local</title><link rel="stylesheet" href="../../css/exchange-credit-checkout.css"><style>
*{box-sizing:border-box}body{margin:0;background:#eef5f5;color:#183d40;font:15px/1.5 system-ui,sans-serif}header.fixture{padding:20px 30px;background:#082c32;color:white;display:flex;justify-content:space-between}header.fixture b{font-size:23px}header.fixture span{font-size:12px;color:#b6d9d9}main{max-width:850px;margin:35px auto;padding:20px}.checkout{max-width:600px;margin:auto;background:white;border:1px solid #dce8e6;border-radius:22px;padding:24px}.tag{color:#008675;font-size:12px}h1{font-size:27px;margin:7px 0 24px}h2{font-size:17px;margin:0 0 4px}.client{border-bottom:1px solid #e1eae8;padding-bottom:18px}p{margin:4px 0;color:#567674}.item{display:flex;gap:15px;align-items:center;padding:22px 0}.photo{width:58px;height:64px;background:linear-gradient(135deg,#cdf0e4,#e7f5f2);border-radius:13px;display:grid;place-items:center;font-size:30px}.item div:nth-child(2){flex:1}.total{display:flex;justify-content:space-between;padding:20px 0;border-top:1px solid #e1eae8;font-size:18px}button.finish{border:0;min-height:48px;border-radius:11px;background:#008b7d;color:white;font:inherit;font-weight:700;width:100%;cursor:pointer}.note{font-size:11px;margin-top:13px;text-align:center}.modal-bg{position:fixed;inset:0;background:#082c3290;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}#result{padding-top:12px;color:#087755}@media(max-width:520px){main{margin:0;padding:16px}.checkout{padding:18px}.modal-bg{align-items:flex-end}header.fixture{padding:15px 20px}header.fixture span{display:none}}
</style></head><body><header class="fixture"><b>Ⅴ VECONI</b><span>QA Beleza · Venda à vista</span></header><main><section class="checkout"><span class="tag">DADOS FICTÍCIOS · SEM CONEXÃO COM PRODUÇÃO</span><h1>Finalizar venda</h1><div class="client"><h2>Camila Souza</h2><p>Cliente selecionado</p></div><div class="item"><span class="photo">◈</span><div><b>Sérum iluminador</b><p>1 unidade · 30 ml</p></div><strong>R$ 70,00</strong></div><div id="sale-totals"><div class="total"><span>Total dos produtos</span><b>R$ 70,00</b></div></div><input type="hidden" id="sale-status" value="pago"><button class="finish" id="finish">Concluir venda</button><p class="note">O crédito não é Fiado. Apenas o complemento é novo recebimento.</p><div id="result" role="status"></div></section></main><div id="modal"></div>
<script>
window.FirebaseSession={user:{uid:'qa-owner'}};window.TeamAccess={has:()=>true};window.DB={getBusinessId:()=> 'qa-business',getWorkspaceGeneration:()=>0};let committed;
window.FirebaseCallable=async(name,r)=>{if(name==='getExchangeCreditBalance')return{availableCents:5000};if(name==='quoteExchangeCreditSale')return{fingerprint:'qa-fingerprint',grossCents:7000,creditUsedCents:r.creditCents,cashReceivedCents:7000-r.creditCents,items:[{productId:'qa-serum',variantId:null,quantity:1,unitCents:7000,totalCents:7000,name:'Sérum iluminador'}]};if(name==='getExchangeCreditSaleStatus')return committed?{committed:true,...committed}:{committed:false};if(name==='confirmExchangeCreditSale'){committed={sale:{id:r.saleId,operationId:r.operationId,businessId:r.businessId,spaceId:r.spaceId,workspaceGeneration:0,clienteId:r.clientId,status:'pago',valorFinal:70,exchangeCreditUsedCents:r.creditCents,cashReceivedCents:7000-r.creditCents},receipt:{operationId:r.operationId,checksum:'qa-receipt',status:'processed'}};return committed;}throw Error('Chamada não prevista nesta prévia fictícia');};
</script><script src="../../js/exchange-credit-checkout.js"></script><script>
const draft={id:'qa-sale-credit',operationId:'qa-operation-credit',clienteId:'qa-camila',spaceId:'qa-space',status:'pago',formaPagamento:'dinheiro',itens:[{produtoId:'qa-serum',quantidade:1,precoFinalUnitario:70}]};
document.querySelector('#finish').onclick=async()=>{try{const s=await ExchangeCreditCheckout.finish(draft);document.querySelector('#result').textContent='Venda QA confirmada. Crédito R$50,00 · complemento R$20,00.';}catch(e){document.querySelector('#result').textContent=e.message;}};
window.fixtureReady=ExchangeCreditCheckout.mount({clientId:'qa-camila',spaceId:'qa-space',totalCents:7000,onRecovered:()=>{}});
</script></body></html>
