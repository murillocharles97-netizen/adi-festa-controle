<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CRM Segment Engine V2 QA</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="stylesheet" href="../css/crm-dashboard.css">
  <link rel="stylesheet" href="../css/engagement-operations.css">
  <link rel="stylesheet" href="../css/crm-mobile.css">
  <link rel="stylesheet" href="../css/crm-segment-builder.css">
  <link rel="stylesheet" href="../css/campanhas.css">
  <link rel="stylesheet" href="../css/mobile-components.css">
  <style>
    *{box-sizing:border-box}html{background:#eaf0f4}body{margin:0;background:#f7f9fb;color:#17233a;font-family:Inter,system-ui,sans-serif}.qa-shell{min-height:100vh;background:#f7f9fb}.qa-side{display:none}.qa-workspace{min-width:0}.qa-header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px minmax(0,1fr) 42px 42px;align-items:center;gap:8px;min-height:82px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid #e4e9ef;background:#fff}.qa-header button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:#17233a;font-size:1.35rem}.qa-header h1,.qa-header p{margin:0}.qa-header h1{font-size:1.25rem}.qa-header p{margin-top:2px;color:#718096;font-size:.72rem}.qa-cloud,.qa-avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#e7f8f3;color:#07866a}.qa-avatar{border-radius:50%;background:#172844;color:#fff;font-weight:900}#app{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}.qa-nav{position:fixed;z-index:18;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #e1e6ed;background:#fff}.qa-nav span{display:grid;place-items:center;color:#65738a;font-size:.67rem}.qa-nav .active{color:#009d78;font-weight:900}.qa-nav .primary{align-self:start;width:56px;height:56px;margin:-14px auto 0;border-radius:50%;background:#08ad83;color:#fff;font-size:1.6rem}.modal-bg{z-index:50}.modal-box{background:#fff}.qa-side b{font-size:1.05rem}.qa-side small{color:#aeb9c7}.qa-side nav{display:grid;gap:8px;margin-top:30px}.qa-side span{padding:12px;border-radius:10px}.qa-side .active{background:#314158;color:#fff}
    @media(min-width:768px){.qa-shell{display:grid;grid-template-columns:220px minmax(0,1fr)}.qa-side{display:block;position:sticky;top:0;height:100vh;padding:26px 18px;background:#1d2b3c;color:#fff}.qa-header{grid-template-columns:44px minmax(0,1fr) 46px 46px;padding:10px 24px}.qa-nav{display:none}#app{max-width:1440px;margin:auto;padding:24px}.crm-dashboard-page{max-width:none}.qa-cloud{margin-left:auto}}
  </style>
</head>
<body>
  <main class="qa-shell">
    <aside class="qa-side"><b>AF · Adi Festa</b><small>Controle de vendas</small><nav><span>Início</span><span>Clientes</span><span class="active">CRM e Relacionamento</span><span>Produtos</span><span>Campanhas</span></nav></aside>
    <section class="qa-workspace">
      <header class="qa-header"><button aria-label="Abrir menu">☰</button><div><h1>CRM e Relacionamento</h1><p>Relacionamento que gera vendas</p></div><span class="qa-cloud">☁</span><span class="qa-avatar">M</span></header>
      <section id="app"></section>
    </section>
    <nav class="qa-nav"><span>Início</span><span>Vender</span><span class="primary">+</span><span class="active">Clientes</span><span>Produtos</span></nav>
  </main>
  <div id="modal"></div>
  <script>
    const DAY=86400000,ago=days=>new Date(Date.now()-days*DAY).toISOString(),future=days=>new Date(Date.now()+days*DAY).toISOString();let serial=0;
    const clients=[
      {id:'ana',businessId:'qa-business',nome:'Ana Clara',telefone:'17999990001',email:'ana@teste.local',cidade:'Rio Preto',ativo:true,saldo:-180,criadoEm:ago(220),marketingConsent:true},
      {id:'jessica',businessId:'qa-business',nome:'Jessica Arezzo',telefone:'17999990002',email:'jessica@teste.local',cidade:'Rio Preto',ativo:true,saldo:0,criadoEm:ago(120),marketingConsent:true},
      {id:'bruno',businessId:'qa-business',nome:'Bruno Silva',telefone:'17999990003',ativo:true,saldo:-50,criadoEm:ago(360),marketingConsent:false},
      {id:'carla',businessId:'qa-business',nome:'Carla Nova',telefone:'17999990004',ativo:true,saldo:0,criadoEm:ago(5),marketingConsent:true},
      {id:'daniel',businessId:'qa-business',nome:'Daniel Lima',telefone:'17999990005',ativo:true,saldo:75,criadoEm:ago(500),marketingConsent:true}
    ];
    const products=[{id:'brownie',businessId:'qa-business',nome:'Brownie',categoria:'Doces',categoryId:'doces',ativo:true},{id:'monster',businessId:'qa-business',nome:'Monster',categoria:'Bebidas',categoryId:'bebidas',ativo:true}];
    const sale=(id,clientId,days,productId,quantity,total)=>({id,operationId:id,businessId:'qa-business',clienteId:clientId,status:'pago',data:ago(days),valorFinal:total,itens:[{produtoId:productId,categoryId:productId==='brownie'?'doces':'bebidas',categoria:productId==='brownie'?'Doces':'Bebidas',quantidade:quantity,subtotalFinal:total}]});
    const database={config:{nomeNegocio:'Adi Festa'},clientes:clients,produtos:products,vendas:[sale('a1','ana',55,'brownie',2,220),sale('a2','ana',35,'brownie',2,180),sale('a3','ana',10,'monster',1,20),sale('j1','jessica',4,'brownie',1,100),sale('b1','bruno',75,'brownie',4,700),sale('c1','carla',2,'monster',1,100),sale('d1','daniel',95,'monster',5,950)],pagamentos:[{id:'pay-a',businessId:'qa-business',clienteId:'ana',data:ago(20)}],cobrancas:[],contatosCliente:[],resgatesCampanha:[],campanhas:[{id:'campaign-a',businessId:'qa-business',type:'buy_get',name:'Compre 5 e ganhe 1',rule:{requiredQuantity:5},rewards:[]}],progressosCampanha:[{id:'progress-a',businessId:'qa-business',campaignId:'campaign-a',clientId:'ana',confirmedProgress:4,availableRewards:0,lastQualifiedAt:ago(10)}],customerSubscriptions:[{id:'renewal-a',businessId:'qa-business',clientId:'jessica',status:'active',expiresAt:future(5),productId:'monster',planName:'Mensal'}],segmentosClientes:[{id:'saved-value',businessId:'qa-business',name:'Clientes bons que sumiram',matchMode:'all',conditions:[{field:'totalSpent',operator:'gt',value:300,period:{key:'all'}},{field:'lastPurchaseDays',operator:'gte',value:30}],pinned:true,active:true}],eventosCampanha:[],recompensas:[],movimentacoesEstoque:[],variacoesProdutos:[],alocacoesPagamento:[],customerSubscriptionEvents:[],messageHistory:[],messageTemplates:[],messageSequences:[],catalogOrders:[],visitas:[],movimentacoes:[],ajustesSaldo:[]};
    window.__crmAudit={reads:0,scrollCalls:[],routes:[]};
    const nativeScrollIntoView=Element.prototype.scrollIntoView;Element.prototype.scrollIntoView=function(options){window.__crmAudit.scrollCalls.push({id:this.id,behavior:options?.behavior||'auto'});if(nativeScrollIntoView)return nativeScrollIntoView.call(this,options)};
    window.Utils={dinheiro:value=>Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),escapar:value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),uuid:()=>`qa-${++serial}`,toast:message=>{document.body.dataset.toast=message}};
    window.DB={carregar:()=>database,alterar:callback=>callback(database),getBusinessId:()=> 'qa-business'};
    window.OperationMode={enabled:()=>true};window.ClientActions={openSheet:()=>{}};window.CRMClienteUI={open:()=>{}};window.ClientesPage={profile:()=>{}};window.PhoneUtils={whatsappUrl:()=>'',normalizeBrazilianPhone:value=>String(value||'').replace(/\D/g,'')};
    window.PlanLimitService={canUseAction:()=>({ok:true}),assert:()=>{},canUseCampaigns:()=>true};window.PlansUI={};window.CentralMensagens={open:()=>{document.body.dataset.messageCenter='open'}};
    window.Router={ir:route=>window.__crmAudit.routes.push(route),atual:()=> 'crm'};window.Modais={fechar:()=>{document.querySelector('#modal').innerHTML=''},confirmar:(_label,callback)=>callback()};window.confirm=()=>true;window.prompt=(_label,value)=>value||'Segmento QA';
  </script>
  <script src="../assets/lucide.min.js"></script>
  <script src="../js/campaign-engine-v2.js"></script>
  <script src="../js/customer-metrics.js"></script>
  <script src="../js/crm-segment-engine-v2.js"></script>
  <script src="../js/engagement-segments.js"></script>
  <script src="../js/crm-segment-builder.js"></script>
  <script src="../js/campanhas.js"></script>
  <script src="../js/campanhas-ui.js"></script>
  <script src="../js/crm-dashboard.js"></script>
  <script src="../js/crm-mobile.js"></script>
  <script>CRMDashboard.refresh();window.lucide?.createIcons();</script>
</body>
</html>
