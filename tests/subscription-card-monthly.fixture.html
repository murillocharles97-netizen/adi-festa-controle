<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cartão mensal e 3DS — fixture</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="stylesheet" href="../css/mobile-components.css">
  <link rel="stylesheet" href="../css/plans.css">
  <style>
    body{margin:0;background:#f5f7f9;color:#17243d}.fixture-shell{max-width:1180px;margin:auto;padding:24px 20px 72px}#modal{position:relative;z-index:1000}.fixture-brick{display:grid;gap:12px;padding:14px;border:1px solid #dce4ec;border-radius:14px;background:#fff}.fixture-brick label{display:grid;gap:5px;font-weight:700}.fixture-brick input{height:44px;padding:0 12px;border:1px solid #cbd5e1;border-radius:10px}.fixture-brick button{height:46px;border:0;border-radius:11px;background:#08a77d;color:#fff;font-weight:800}@media(max-width:767px){.fixture-shell{padding:18px 12px 92px}}
  </style>
</head>
<body>
  <main class="fixture-shell" id="app"></main><div id="modal"></div>
  <script src="../assets/lucide.min.js"></script>
  <script>
    const state=new URLSearchParams(location.search).get('state')||'form';
    const plan={id:'premium',name:'Premium',summary:'Para negócios que querem o máximo.',monthlyPrice:79.9,yearlyPrice:799,features:{products:true,stock:true,sales:true,clients:true,campaigns:true,crm:true,onlineCatalog:true,onlineOrders:true},limits:{users:10,products:10000,clients:25000,monthlySales:50000}};
    let submitted=null;
    window.MP_DEVICE_SESSION_ID='device_fixture_123456789';
    window.MercadoPago=function(publicKey){window.__fixturePublicKey=publicKey;return{bricks:()=>({create:async(_type,id,settings)=>{const host=document.getElementById(id);host.innerHTML='<div class="fixture-brick"><label>Número do cartão<input value="•••• •••• •••• 2429" readonly></label><label>Nome do titular<input value="CAIO HENRIQUE" readonly></label><button type="button" data-fixture-pay>Confirmar cartão mensal</button></div>';host.querySelector('[data-fixture-pay]').onclick=()=>settings.callbacks.onSubmit({token:'token_fixture_1234567890',payment_method_id:'visa',issuer_id:'25',installments:1,payer:{identification:{type:'CPF',number:'12345678909'}}});settings.callbacks.onReady();return{unmount:async()=>{host.innerHTML=''}}}})}};
    const context={subscription:{planId:'trial',status:'trialing',trialEndsAt:new Date(Date.now()+86400000).toISOString()},access:{status:'trialing',readOnly:false,limits:plan.limits,effectivePlan:plan},business:{id:'fixture-business',name:'Loja Exemplo',limits:plan.limits},profile:{uid:'fixture-owner',role:'owner'}};
    window.Utils={escapar:value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]),toast:()=>{}};
    window.DB={carregar:()=>({produtos:[],clientes:[],vendas:[]})};window.BusinessContext={get:()=>context};window.FirebaseSession={user:{uid:'fixture-owner',email:'contato@loja.com'},profile:{uid:'fixture-owner',email:'contato@loja.com'}};window.PlanLimitService={canUseFeature:()=>({ok:true}),canUseAction:()=>({ok:true})};window.Router={ir:()=>{},render:()=>{}};
    window.SubscriptionService={getPlans:()=>[plan],validateCoupon:async()=>null,getBillingCheckoutConfig:async()=>({publicKey:'APP_USR_fixture_public_key_123456',threeDsMode:'on_fraud_risk'}),requestUpgrade:async(_id,options)=>{submitted=options;const base={id:'fixture-card-attempt',paymentMethodType:'card_monthly',providerStatus:'action_required',statusDetail:'pending_challenge',orderId:'fixture-order',paymentId:'fixture-payment',originalAmount:79.9,discountAmount:0,finalAmount:79.9};if(state==='approved')return{card:{...base,status:'payment_approved',providerStatus:'processed',statusDetail:'accredited'}};if(state==='rejected')return{card:{...base,status:'failed',providerStatus:'failed',statusDetail:'cc_rejected_high_risk'}};return{card:{...base,status:'payment_challenge',challengeUrl:'https://3ds.example.invalid/challenge'}}},checkCardCheckout:async()=>({card:{id:'fixture-card-attempt',status:'payment_approved',providerStatus:'processed',statusDetail:'accredited'}}),syncSubscriptionStatus:async()=>({}),requestCancellation:async()=>({})};
  </script>
  <script src="../js/plans.js"></script>
  <script>
    (async()=>{const app=document.getElementById('app');app.innerHTML=PlansUI.render();PlansUI.bind(app);document.querySelector('[data-plan-cta="premium"]').click();await new Promise(r=>setTimeout(r,30));document.querySelector('[data-payment-option="card_monthly"]').click();document.querySelector('[data-billing-payer-email]').value='caio.pagador@example.com';document.querySelector('[data-start-checkout]').click();await new Promise(r=>setTimeout(r,80));if(state!=='form'){document.querySelector('[data-fixture-pay]')?.click();await new Promise(r=>setTimeout(r,120))}window.__cardMonthlyFixture={ready:true,state,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,hasBrick:Boolean(document.querySelector('.fixture-brick')),hasChallenge:Boolean(document.querySelector('[data-card-challenge]')),approved:Boolean(document.querySelector('[data-card-finish]')),rejected:Boolean(document.querySelector('[data-card-retry-monthly]')),submitted:Boolean(submitted),paymentMethodType:submitted?.paymentMethodType||null,deviceSessionId:submitted?.deviceSessionId||null,payerEmail:submitted?.billingPayerEmail||null,tokenSent:Boolean(submitted?.cardPayment?.token),panStored:JSON.stringify(submitted||{}).includes('2429')};})();
  </script>
</body>
</html>
