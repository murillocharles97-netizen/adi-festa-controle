<html lang="pt-BR">

  <style>

e-bottom-safe-height)}.fixture-mobile-topbar{display:grid;grid-template-columns:46px minmax(0,1fr) 46px 46px;align-items:center;gap:8px;min-height:78px;padding:calc(10px + var(--safe-top)) 14px 10px;border-bottom:1px solid #e5eaf0;background:#fff}.fixture-mobile-topbar button{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:13px;background:transparent;color:#14263f}.fixture-mobile-topbar div{min-width:0}.fixture-mobile-topbar h1{margin:0;font-size:1.25rem}.fixture-mobile-topbar p{margin:3px 0 0;color:#718095;font-size:.72rem}.fixture-mobile-topbar .cloud{background:#edf9f5;color:#0a9b74}.fixture-mobile-topbar .avatar{border-radius:50%;background:#172943;color:#fff;font-weight:800}.fixture-shell{min-height:0;padding:10px 0 0}.fixture-head{display:none}.fixture-bottom-nav{position:fixed;z-index:90;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);height:var(--mobile-bottom-safe-height);padding:5px 8px var(--safe-bottom);border-top:1px solid #e0e6ec;background:#fff}.fixture-bottom-nav a,.fixture-bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;border:0;background:transparent;color:#69778d;font-size:.61rem}.fixture-bottom-nav svg{width:21px;height:21px}.fixture-bottom-nav .mobile-client-fab{border-radius:17px;background:#e8f9f4;color:#079d76}.fixture-bottom-nav .mobile-client-fab svg{width:28px;height:28px}.modal-bg{padding:0;place-items:stretch}.modal-box{width:100%;max-height:none;border-radius:0}.form-grid{grid-template-columns:1fr}}

<body>

    <header class="fixture-head"><div><b>Adi Festa Controle</b><small>Campaign Engine V2 — ambiente local</small></div><span class="fixture-badge">Sem produção</span></header>
    <div id="app"></div>
  </main>

        escapar(value){return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));},
        uuid(){ sequence += 1; return `local-operation-${sequence}`; },
        toast(message, error){ const el=document.createElement("div");el.textContent=message;el.style.cssText=`position:fixed;right:18px;top:18px;z-index:1200;padding:12px 16px;border-radius:10px;background:${error?'#c83242':'#087b5e'};color:white;font-weight:700`;document.body.append(el);setTimeout(()=>el.remove(),1800); },
