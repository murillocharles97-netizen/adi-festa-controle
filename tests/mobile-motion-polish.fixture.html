<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="../css/product-images.css">
  <link rel="stylesheet" href="../css/mobile-motion.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#14233d;font:14px Arial,sans-serif}.fixture{width:100%;min-height:100dvh;padding:18px 16px 94px}.fixture header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.fixture h1{font-size:26px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar button{min-height:42px;border:1px solid #dce3ea;border-radius:14px;padding:0 14px;background:#fff;font-weight:800}.toolbar button.active{background:#11b78b;color:#fff}.demo-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.demo-products.list{grid-template-columns:1fr}.demo-card{position:relative;min-height:220px;display:grid;grid-template-rows:126px auto auto auto;gap:6px;padding:10px;border:1px solid #dfe5eb;border-radius:18px;background:#fff}.demo-products.list .demo-card{min-height:94px;grid-template-columns:64px 1fr auto;grid-template-rows:auto auto auto}.demo-card .product-photo-shell{width:100%;height:126px;border-radius:14px}.demo-products.list .product-photo-shell{grid-row:1/4;width:64px;height:74px}.demo-card b{font-size:15px}.price{color:#05a67d;font-weight:900}.favorite{position:absolute;right:8px;top:8px;width:42px;height:42px;border:0;background:#fff8;border-radius:50%;font-size:23px;color:#8894a5}.favorite.active{color:#ffae00}.stock{height:6px;border-radius:8px;background:#e6ebef;overflow:hidden}.stock i{display:block;width:32%;height:100%;background:#f1a600;transition:width var(--motion-normal) var(--motion-ease),background var(--motion-fast)}.sale-screen[hidden],.products-screen[hidden]{display:none}.recent{display:flex;gap:8px;overflow:auto;scroll-snap-type:x proximity}.recent button{flex:0 0 150px;scroll-snap-align:start;min-height:74px;border:1px solid #dde4ea;border-radius:16px;background:#fff}.sale-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.sale-card{position:relative;min-height:190px;border:1px solid #dfe5eb;border-radius:18px;background:#fff;padding:10px}.sale-card .product-photo-shell{width:72px;height:108px;border-radius:14px}.sale-card .count{position:absolute;right:48px;bottom:12px;color:#079c78;font-size:17px;font-weight:900}.sale-card .plus{position:absolute;right:9px;bottom:9px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#0eb78b;color:#fff;font-size:23px}.bag{position:fixed;right:18px;bottom:22px;display:grid;place-items:center;width:60px;height:60px;border:0;border-radius:50%;background:#182941;color:#fff;z-index:20}.sheet-scrim{position:fixed;inset:0;display:grid;align-items:end;background:#10182788;z-index:30}.sheet{padding:18px 16px 28px;border-radius:24px 24px 0 0;background:#fff}.sheet-row{display:flex;align-items:center;gap:10px;padding:12px 0}.sheet-row .product-photo-shell{width:48px;height:62px;border-radius:12px}.fixture-tabs{position:fixed;inset:auto 0 0;display:flex;justify-content:center;gap:8px;padding:10px;background:#fff}.fixture-tabs button{min-height:46px;border:0;border-radius:15px;padding:0 24px}.fixture-tabs .active{background:#e2f8f1;color:#078b6c}.filtered-out{display:none}.feedback{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#fff;color:#d83949;box-shadow:0 8px 22px #17243c22}
  </style>
</head>
<body>
  <main class="fixture">
    <section class="products-screen">
      <header><div><small>Adi Festa</small><h1>Produtos</h1></div><b>Mobile</b></header>
      <div class="toolbar"><button data-layout="grid" class="active">Grade</button><button data-layout="list">Lista</button><button data-filter>Em estoque</button></div>
      <div class="demo-products grid" id="fixture-products"></div>
    </section>
    <section class="sale-screen" hidden>
      <header><div><small>quinta-feira, 14 de agosto</small><h1>Vender</h1></div><b>Nuvem</b></header>
      <div class="recent" id="fixture-recent"></div>
      <div class="sale-grid" id="fixture-sale"></div>
      <button class="bag" id="fixture-bag" aria-label="Sacola">▣</button>
    </section>
  </main>
  <nav class="fixture-tabs"><button data-screen="products" class="active">Produtos</button><button data-screen="sale">Vender</button></nav>
  <div id="fixture-modal"></div>
  <script src="../js/mobile-motion.js"></script>
  <script>
    window.__mobileMotionLongTasks=[];
    try{new PerformanceObserver(list=>window.__mobileMotionLongTasks.push(...list.getEntries().map(entry=>entry.duration))).observe({type:'longtask',buffered:true})}catch{}
    const products=[
      {id:'brownie',name:'Brownie',price:'R$ 10,00',color:'#7b3f25'},
      {id:'monster',name:'Monsters',price:'R$ 13,00',color:'#101813'},
      {id:'coca',name:'Coca zero 220ml',price:'R$ 3,50',color:'#b82024'},
      {id:'cone',name:'Cone recheado',price:'R$ 12,00',color:'#b8712e'}
    ];
    const photo=p=>`<span class="product-photo-shell is-loading" style="background:${p.color}18"><img data-demo-photo="${p.id}" alt="${p.name}"><span class="product-photo-fallback" hidden>${p.name.slice(0,2).toUpperCase()}</span></span>`;
    const productHost=document.querySelector('#fixture-products'),saleHost=document.querySelector('#fixture-sale'),recentHost=document.querySelector('#fixture-recent');
    productHost.innerHTML=products.map(p=>`<article class="demo-card" data-product-shell="${p.id}">${photo(p)}<b>${p.name}</b><span class="price">${p.price}</span><span class="stock"><i></i></span><button class="favorite" aria-label="Favoritar">☆</button></article>`).join('');
    saleHost.innerHTML=products.map((p,index)=>`<button class="sale-card" data-sale-product="${p.id}" data-variable="${index===3}">${photo(p)}<b>${p.name}</b><p class="price">${p.price}</p><span class="count">0</span><span class="plus">+</span></button>`).join('');
    recentHost.innerHTML=products.map(p=>`<button>${p.name}<br><b class="price">${p.price}</b></button>`).join('');
    requestAnimationFrame(()=>document.querySelectorAll('[data-demo-photo]').forEach((image,index)=>setTimeout(()=>{const product=products.find(item=>item.id===image.dataset.demoPhoto),svg=`<svg xmlns="http://www.w3.org/2000/svg" width="180" height="240"><rect width="100%" height="100%" rx="24" fill="${product.color}"/><circle cx="90" cy="96" r="54" fill="white" fill-opacity=".14"/><text x="90" y="112" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="white">${product.name.slice(0,2).toUpperCase()}</text></svg>`;image.onload=()=>image.parentElement.classList.remove('is-loading');image.src=`data:image/svg+xml,${encodeURIComponent(svg)}`},120+index*42)));
    document.querySelectorAll('[data-layout]').forEach(button=>button.onclick=()=>{const before=MobileMotion.capture(productHost,'[data-product-shell]','data-product-shell');productHost.className=`demo-products ${button.dataset.layout}`;document.querySelectorAll('[data-layout]').forEach(item=>item.classList.toggle('active',item===button));requestAnimationFrame(()=>MobileMotion.flip(productHost,before,'[data-product-shell]','data-product-shell',{name:'layout',duration:235}))});
    document.querySelector('[data-filter]').onclick=event=>{event.currentTarget.classList.toggle('active');[...productHost.children].forEach((card,index)=>{card.classList.toggle('filtered-out',event.currentTarget.classList.contains('active')&&index%2);if(!card.classList.contains('filtered-out'))MobileMotion.animate(card,[{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:180})})};
    productHost.onclick=event=>{const favorite=event.target.closest('.favorite');if(favorite){favorite.classList.toggle('active');favorite.textContent=favorite.classList.contains('active')?'★':'☆';MobileMotion.pop(favorite);return}MobileMotion.press(event.target.closest('.demo-card'))};
    document.querySelectorAll('[data-screen]').forEach(button=>button.onclick=()=>{document.querySelector('.products-screen').hidden=button.dataset.screen!=='products';document.querySelector('.sale-screen').hidden=button.dataset.screen!=='sale';document.querySelectorAll('[data-screen]').forEach(item=>item.classList.toggle('active',item===button))});
    const quantities=new Map();
    function openSheet(card){const product=products.find(item=>item.id===card.dataset.saleProduct),modal=document.querySelector('#fixture-modal');modal.innerHTML=`<div class="sheet-scrim"><section class="sheet"><h2>Escolha uma opção</h2><div class="sheet-row">${photo(product)}<b>${product.name} · Tradicional</b></div><button data-close-sheet>Adicionar à sacola</button></section></div>`;MobileMotion.sheet(modal.querySelector('.sheet'));modal.querySelector('.sheet-scrim').onclick=e=>{if(e.target===e.currentTarget)modal.innerHTML=''};modal.querySelector('[data-close-sheet]').onclick=()=>modal.innerHTML=''}
    saleHost.onclick=event=>{const card=event.target.closest('.sale-card');if(!card)return;if(card.dataset.variable==='true'){openSheet(card);return}const from=quantities.get(card.dataset.saleProduct)||0,to=from+1;quantities.set(card.dataset.saleProduct,to);MobileMotion.press(card);MobileMotion.counter(card.querySelector('.count'),from,to);if(from===0)MobileMotion.fly(card,document.querySelector('#fixture-bag'),{fallback:card.dataset.saleProduct.slice(0,2).toUpperCase()})};
    window.__mobileMotionFixture={productHost,saleHost,products,quantities,openSheet};
  </script>
</body>
</html>
