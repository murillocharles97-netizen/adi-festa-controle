  <script src="../js/plans.js"></script>
  <script>
    (async()=>{
      if(state==="card-declined")sessionStorage.setItem("adiFesta:billing:card-checkout-return",JSON.stringify({planId:"premium",billingCycle:"monthly",couponCode:"PARCEIRO20",billingPayerEmail:"felipe.pessoal@gmail.com",startedAt:Date.now()}));
      const app=document.querySelector("#app");
      app.innerHTML=PlansUI.render();PlansUI.bind(app);
      await new Promise(resolve=>setTimeout(resolve,80));
      if(state==="card-live-activation"){
        dispatchEvent(new CustomEvent("business-context-changed",{detail:fixtureContext}));
        fixtureContext={...fixtureContext,subscription:{planId:"premium",status:"active",subscriptionStatus:"active",paymentMethodType:"card",currentPeriodStart:"2026-09-01T13:14:31.000Z",currentPeriodEnd:"2026-10-01T13:14:28.000Z",nextBillingDate:"2026-10-01T13:14:28.000Z",mercadoPago:{subscriptionId:"fixture-card-pending",providerStatus:"authorized"}},access:{...fixtureContext.access,status:"active",planId:"premium",readOnly:false,active:true},business:{...fixtureContext.business,subscription:{planId:"premium",status:"active"}}};
        dispatchEvent(new CustomEvent("business-context-changed",{detail:fixtureContext}));
        await new Promise(resolve=>setTimeout(resolve,80));
      }
      if(["coupon","payment","card","card-payer","pix","qr","pending","approved","expired","failed","regenerated"].includes(state)){
        const details=document.querySelector(".plan-coupon");details.open=true;
        document.querySelector("[data-coupon-code]").value="PARCEIRO20";
        document.querySelector("[data-coupon-plan]").value="professional";
        document.querySelector("[data-apply-coupon]").click();
        await new Promise(resolve=>setTimeout(resolve,30));
      }
      if(["payment","card","card-payer","pix","qr","pending","approved","expired","failed","regenerated"].includes(state)){
        document.querySelector('[data-plan-cta="professional"]').click();
        await new Promise(resolve=>setTimeout(resolve,30));
      }
      if(["pix","qr","pending","approved","expired","failed","regenerated"].includes(state))document.querySelector('[data-payment-option="pix_monthly"]').click();
      if(["qr","pending","approved","expired","failed","regenerated"].includes(state)){
        document.querySelector('[data-start-checkout]').click();
        await new Promise(resolve=>setTimeout(resolve,40));
      }
      if(state==="regenerated"){
        document.querySelector('[data-pix-regenerate]').click();
        await new Promise(resolve=>setTimeout(resolve,20));
        document.querySelector('[data-start-checkout]').click();
        await new Promise(resolve=>setTimeout(resolve,40));
      }
      window.__subscriptionPixFixture={state,ready:true,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,selectedPayment:document.querySelector('[data-payment-option].active')?.dataset.paymentOption||null,billingPayerEmail:document.querySelector('[data-billing-payer-email]')?.value||null,payerHelper:document.querySelector('[data-card-payer]')?.textContent.includes('pode ser diferente do e-mail da sua empresa')||false,pixModal:Boolean(document.querySelector('.plan-pix-sheet')),approved:Boolean(document.querySelector('.plan-pix-result.success')),expired:Boolean(document.querySelector('.plan-pix-result.expired h3')?.textContent.includes('Pix expirado')),failed:Boolean(document.querySelector('.plan-pix-result.expired h3')?.textContent.includes('Não foi possível')),cardDeclined:Boolean(document.querySelector('.plan-card-decline')?.textContent.includes('análise de segurança')),cardRetry:Boolean(document.querySelector('[data-retry-card]')?.textContent.includes('cobrança automática')),cardFallbackMonthly:Boolean(document.querySelector('[data-card-fallback-monthly]')?.textContent.includes('Pagar este mês com cartão')),cardFallbackPix:Boolean(document.querySelector('[data-card-fallback-pix]')),declinedCouponPreserved:document.querySelector('.plan-card-decline')?.textContent.includes('PARCEIRO20')||false,hasCopy:Boolean(document.querySelector('[data-copy-pix]')),hasQr:Boolean(document.querySelector('.plan-pix-qr img')),hasVerify:Boolean(document.querySelector('[data-verify-pix-payment]')),hasVerifyCard:Boolean(document.querySelector('[data-verify-card-payment]')),hasCancelCard:Boolean(document.querySelector('[data-cancel-pending-card]')),pendingFalseCleared:state==='card-cleared'&&!document.querySelector('.plan-state-hero')?.textContent.includes('Aguardando conclusão do checkout'),liveActive:state==='card-live-activation'&&liveMountCount===1&&document.querySelector('.plan-state-hero')?.textContent.includes('Premium')&&document.querySelector('.     })();
