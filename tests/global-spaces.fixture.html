<html lang="pt-BR">
<head>

  <style>
    :root{color-scheme:light}.qa-layout{min-height:100vh}.qa-sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:238px;padding:22px 15px;background:#17243b;color:#fff}.qa-brand{display:flex;align-items:center;gap:11px;padding:0 7px 25px}.qa-brand>span{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:#37d3ad;color:#142038;font-weight:950}.qa-brand b,.qa-brand small{display:block}.qa-brand small{margin-top:3px;color:#aeb9c9;font-size:11px}.qa-nav{display:grid;gap:5px}.qa-nav span{display:flex;align-items:center;gap:11px;min-height:45px;padding:0 13px;border-radius:12px;color:#cad3df;font-weight:750}.qa-nav span.active{background:#ffffff13;color:#fff;box-shadow:inset 3px 0 #31d0ad}.qa-sidebar footer{position:absolute;right:20px;bottom:22px;left:20px;color:#9eabba;font-size:11px}.qa-shell{min-height:100vh;margin-left:238px}.qa-topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;height:72px;padding:0 24px;border-bottom:1px solid #e5e9ee;background:#fff}.qa-menu{display:none}.qa-title{min-width:0}.qa-title h1,.qa-title p{margin:0}.qa-title h1{font-size:21px}.qa-title p{margin-top:2px;color:#758297;font-size:11px}.qa-cloud{margin-left:auto;padding:7px 11px;border-radius:99px;background:#e8faf5;color:#087d65;font-size:11px;font-weight:850}.qa-avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#17243b;color:#fff;font-weight:900}.qa-main{width:100%;max-width:1180px;margin:auto;padding:22px}.qa-page{display:grid;gap:14px;min-width:0}.qa-page-heading{display:flex;align-items:end;justify-content:space-between;gap:14px}.qa-page-heading h2,.qa-page-heading p{margin:0}.qa-page-heading h2{font-size:25px}.qa-page-heading p{margin-top:4px;color:#6f7d91}.qa-context-summary{display:flex;align-items:center;gap:10px;min-height:58px;padding:11px 13px;border:1px solid #dce6e3;border-radius:15px;background:#fff}.qa-context-summary>i{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;border-radius:12px;background:#e5f8f2;color:#078d70}.qa-context-summary svg{width:18px}.qa-context-summary span{display:grid;min-width:0}.qa-context-summary b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qa-context-summary small{margin-top:2px;color:#728095}.qa-mobile-goal{display:none}.qa-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.qa-kpi{display:grid;grid-template-columns:40px minmax(0,1fr);gap:3px 10px;min-width:0;padding:15px;border:1px solid #e2e7ec;border-radius:17px;background:#fff;box-shadow:0 6px 20px rgba(31,48,72,.045)}.qa-kpi>i{display:grid;grid-row:1/3;place-items:center;width:40px;height:40px;border-radius:13px;background:#e6f8f3;color:#078d70}.qa-kpi svg{width:20px}.qa-kpi small{grid-column:2;overflow:hidden;color:#728095;text-overflow:ellipsis;white-space:nowrap}.qa-kpi strong{grid-column:2;overflow:hidden;color:#17243b;font-size:18px;text-overflow:ellipsis;white-space:nowrap}.qa-panels{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}.qa-panel{min-width:0;padding:16px;border:1px solid #e2e7ec;border-radius:18px;background:#fff;box-shadow:0 6px 20px rgba(31,48,72,.04)}.qa-panel h3{margin:0 0 12px;font-size:15px}.qa-chart{display:flex;align-items:end;gap:8px;height:125px;padding:8px 5px 0;border-bottom:1px solid #dfe6e9}.qa-chart span{flex:1;min-width:0;height:var(--bar);border-radius:7px 7px 2px 2px;background:linear-gradient(#38d2ad,#0b9274)}.qa-activity{display:grid;gap:8px}.qa-activity div{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px;border-radius:12px;background:#f6f8fa}.qa-activity i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#e7f8f3;color:#078d70}.qa-activity b,.qa-activity small{display:block}.qa-activity small{color:#758297;font-size:10px}.qa-activity strong{color:#087d65;font-size:12px}.qa-sale-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(270px,.7fr);gap:14px;align-items:start}.qa-catalog,.qa-cart{min-width:0;padding:16px;border:1px solid #e1e7eb;border-radius:18px;background:#fff}.qa-catalog header,.qa-cart header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.qa-catalog h3,.qa-cart h3{margin:0}.qa-catalog header span{color:#718096;font-size:11px}.qa-product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.qa-product{display:grid;grid-template-columns:42px minmax(0,1fr);gap:3px 10px;min-height:76px;padding:11px;border:1px solid #dfe6ea;border-radius:14px;background:#fbfcfd;text-align:left}.qa-product>i{display:grid;grid-row:1/3;place-items:center;width:42px;height:42px;border-radius:13px;background:#e8f8f4;color:#078d70}.qa-product b,.qa-product small{grid-column:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qa-product small{color:#6f7d91}.qa-cart-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e7ebef}.qa-cart-row span{display:grid}.qa-cart-row small{color:#768398}.qa-total{display:flex;justify-content:space-between;align-items:center;padding:15px 0;font-size:17px}.qa-finish{width:100%;min-height:48px;border:0;border-radius:13px;background:#24c6a1;color:#15302b;font-weight:900}.qa-product-editor{max-width:700px;margin:auto}.qa-product-editor>header{margin-bottom:13px}.qa-product-editor h2,.qa-product-editor p{margin:0}.qa-product-editor p{margin-top:4px;color:#718096}.qa-editor-card{padding:16px;border:1px solid #e0e6ea;border-radius:18px;background:#fff}.qa-bottom-nav{display:none}.qa-availability-modal{width:min(680px,calc(100vw - 28px));max-height:min(780px,calc(100dvh - 28px));overflow:auto}.qa-availability-modal .modal-body>p{margin:0 0 8px;color:#68778c;line-height:1.45}
    @media(max-width:960px) and (min-width:768px){.qa-sidebar{width:200px}.qa-shell{margin-left:200px}.qa-main{padding:18px}.qa-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.qa-panels,.qa-sale-layout{grid-template-columns:1fr}.qa-product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:767px){.qa-sidebar{display:none}.qa-shell{margin-left:0}.qa-topbar{height:68px;padding:0 13px}.qa-menu{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#17243b}.qa-title h1{font-size:20px}.qa-title p{font-size:10px}.qa-cloud{width:38px;height:38px;margin-left:auto;padding:0;font-size:0}.qa-cloud:after{content:'✓';font-size:16px}.qa-avatar{width:38px;height:38px}.qa-main{padding:13px 13px 96px}.qa-page{gap:11px}.qa-page-heading{align-items:start}.qa-page-heading h2{font-size:22px}.qa-page-heading p{font-size:12px}.qa-page-heading>small{display:none}.qa-mobile-goal{display:block}.desktop-space-goal{display:none}.qa-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.qa-kpi{grid-template-columns:34px minmax(0,1fr);gap:2px 8px;padding:11px 9px}.qa-kpi>i{width:34px;height:34px}.qa-kpi strong{font-size:clamp(15px,5vw,18px)}.qa-panels{grid-template-columns:1fr}.qa-panels .qa-panel:last-child{display:none}.qa-context-summary{min-height:54px;padding:9px 10px}.qa-sale-layout{grid-template-columns:1fr;gap:10px}.qa-catalog,.qa-cart{padding:12px}.qa-product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.qa-product{grid-template-columns:34px minmax(0,1fr);min-height:68px;padding:9px 8px}.qa-product>i{width:34px;height:34px}.qa-product b{font-size:12px}.qa-product small{font-size:10px}.qa-cart{margin-bottom:8px}.qa-product-editor>header h2{font-size:21px}.qa-editor-card{padding:12px}.qa-bottom-nav{position:fixed;right:0;bottom:0;left:0;z-index:18;display:grid;grid-template-columns:repeat(4,1fr);height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #e1e6eb;background:#fff}.qa-bottom-nav span{display:grid;place-items:center;min-width:0;color:#718096;font-size:10px}.qa-bottom-nav span.active{color:#078d70;font-weight:900}.qa-availability-modal{width:min(100%,calc(100vw - 16px));max-height:calc(100dvh - 16px)}}
    @media(max-width:350px){.qa-main{padding-inline:10px}.qa-kpis{grid-template-columns:1fr}.qa-product-grid{grid-template-columns:1fr}.qa-cloud{display:none}.qa-title h1{font-size:19px}}
  </style>
</head>
<body>
  <div class="qa-layout">
    <aside class="qa-sidebar"><div class="qa-brand"><span>V</span><div><b>Adi Festa</b><small>Gestão integrada</small></div></div><nav class="qa-nav"><span class="active"><i data-lucide="layout-dashboard"></i> Início</span><span><i data-lucide="shopping-bag"></i> Vender</span><span><i data-lucide="users"></i> Clientes</span><span><i data-lucide="package"></i> Produtos</span><span><i data-lucide="wallet-cards"></i> Financeiro</span></nav><footer>Ambiente visual · V143</footer></aside>
    <div class="qa-shell">
      <header class="qa-topbar"><button class="qa-menu" type="button" aria-label="Abrir menu"><i data-lucide="menu"></i></button><div class="qa-title"><h1 data-qa-title>Início</h1><p>terça-feira, 15 de setembro</p></div><span class="qa-cloud">Sincronizado</span><span class="qa-avatar">M</span></header>
      <main class="qa-main" id="app"></main>
    </div>
    <nav class="qa-bottom-nav"><span data-nav="home">Início</span><span data-nav="sales">Vender</span><span>Clientes</span><span>Produtos</span></nav>
  </div>
  <div id="modal"></div><div id="toasts"></div>
  <script src="/assets/lucide.min.js"></script>
  <script>
    const ids={adi:'business_adi-festa',iptv:'76dea1f8-22de-472f-9b53-0fd608c5cd54',prime:'3a047a87-f4b9-4b2a-b244-4ae3e2532ecc',casa:'28332988-1202-4980-b6c2-e5ad8a29d316'};
    const fixtureState=new URLSearchParams(location.search).get('state')||'home-all';
    const fixtureDb={config:{nome:'Adi Festa',dashboard:{dailySalesGoal:600,dailySalesGoalsBySpaceId:{[ids.adi]:450,[ids.iptv]:180}}},produtos:[],vendas:[],clientes:[],pagamentos:[],catalogOrders:[],customerSubscriptions:[]};
    window.FirebaseSession={businessId:'adi-festa',business:{id:'adi-festa',name:'Adi Festa'},user:{uid:'owner-qa'},profile:{uid:'owner-qa',name:'Murillo',role:'owner'}};
    window.DB={getBusinessId:()=> 'adi-festa',carregar:()=>fixtureDb,alterar(mutator){mutator(fixtureDb);return fixtureDb}};
    window.Utils={toast(){},escapar:value=>String(value)};
    window.Router={atual:()=>fixtureState.startsWith('sales')?'vender':'inicio'};
    window.AppPageRuntime={mount(){}};
  </script>
  <script src="/js/spaces.js"></script>
  <script>
    const spaces=[
      {id:ids.adi,businessId:'adi-festa',linkedBusinessId:'adi-festa',ownerUid:'owner-qa',name:'Adi Festa',type:'business',operationalType:'unit',active:true,status:'active',isDefault:true,capabilities:{finance:true,sales:true,products:true,inventory:true,goals:true}},
      {id:ids.iptv,businessId:'adi-festa',linkedBusinessId:'adi-festa',ownerUid:'owner-qa',name:'IPTV',type:'business',operationalType:'operation',active:true,status:'active',capabilities:{finance:true,sales:true,products:true,inventory:false,goals:true}},
      {id:ids.prime,businessId:'adi-festa',linkedBusinessId:'adi-festa',ownerUid:'owner-qa',name:'Primeline 3D — encomendas personalizadas',type:'business',operationalType:'operation',active:true,status:'active',capabilities:{finance:true,sales:true,products:true,inventory:true,goals:true}},
      {id:ids.casa,businessId:null,ownerUid:'owner-qa',name:'Casa',type:'personal',operationalType:'personal',active:true,status:'active',capabilities:{finance:true,sales:false,products:false,inventory:false,goals:false}}
    ];
    const products=[
      {id:'p-all',nome:'Kit festa completo',preco:89.9,spaceAccessMode:'all_spaces'},
      {id:'p-adi',nome:'Cone recheado',preco:12,spaceAccessMode:'single_space',defaultSpaceId:ids.adi,allowedSpaceIds:[ids.adi]},
      {id:'p-iptv',nome:'Renovação IPTV 30 dias',preco:25.9,itemKind:'service',spaceAccessMode:'single_space',defaultSpaceId:ids.iptv,allowedSpaceIds:[ids.iptv]},
      {id:'p-prime',nome:'Letreiro 3D personalizado',preco:74,spaceAccessMode:'single_space',defaultSpaceId:ids.prime,allowedSpaceIds:[ids.prime]}
    ];
    SpaceContext.setSpaces(spaces,{loaded:true});
    SpaceContext.setAdapter({async create(){},async update(){}});
    const stateSpace=fixtureState.includes('iptv')?ids.iptv:ids.adi;
    if(fixtureState==='home-all'||fixtureState==='home-picker')SpaceContext.selectHome(SpaceContext.ALL_SPACES);
    else if(fixtureState.startsWith('home')||fixtureState.startsWith('goal'))SpaceContext.selectHome(stateSpace);
    else if(fixtureState.startsWith('sales'))SpaceContext.selectSales(stateSpace);
    const money=value=>Number(value).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const icon=name=>`<i data-lucide="${name}"></i>`;
    const metrics={all:{revenue:765,profit:318,clients:42,orders:16,goal:600},adi:{revenue:445,profit:198,clients:27,orders:10,goal:450},iptv:{revenue:120,profit:86,clients:8,orders:4,goal:180}};
    function currentKey(){return SpaceContext.homeId()===SpaceContext.ALL_SPACES?'all':SpaceContext.homeId()===ids.iptv?'iptv':'adi'}
    function goalMarkup(data,label){const percent=Math.round(data.revenue/data.goal*100),progress=Math.min(100,percent);return `<button class="home-goal-card qa-mobile-goal" type="button" data-home-goal><header><span>${icon('target')} ${label}</span><strong>${percent}%</strong></header><div class="goal-values"><strong>${money(data.revenue)}</strong><span>de ${money(data.goal)}</span></div><div class="goal-progress"><span style="--goal:${progress}%"></span><b>${percent}%</b></div><p>${icon('sparkles')} Acompanhe o progresso deste contexto</p></button><section class="desktop-space-goal"><span class="desktop-space-goal-icon">${icon('target')}</span><div class="desktop-space-goal-copy"><b>${label}</b><small>${currentKey()==='all'?'Meta independente das metas dos espaços.':'Somente vendas deste espaço entram no progresso.'}</small></div><div class="desktop-space-goal-values"><span><strong>${money(data.revenue)}</strong> de ${money(data.goal)}</span><div><i style="--space-goal-progress:${progress}%"></i></div></div><em>${percent}%</em><button type="button" data-home-goal>Editar ${icon('chevron-right')}</button></section>`}
    function renderHome(){const key=currentKey(),data=metrics[key],label=key==='all'?'Meta geral diária':`Meta diária · ${SpaceContext.selectionLabel('home')}`,scope=key==='all'?'Visão consolidada da empresa':`Indicadores exclusivos de ${SpaceContext.selectionLabel('home')}`;return `<section class="qa-page qa-home" data-qa-page="home"><header class="qa-page-heading"><div><h2>Olá, Murillo</h2><p>Veja como seus espaços estão hoje.</p></div><small>Atualizado agora</small></header>${SpaceContext.renderBar('home')}<section class="qa-context-summary">${icon(key==='all'?'layers-3':'map-pin')}<span><b>${scope}</b><small>${key==='all'?'Vendas antigas sem espaço continuam apenas aqui.':'Dados sem espaço não são atribuídos automaticamente.'}</small></span></section>${key==='all'?'<aside class="space-data-notice">'+icon('history')+'<span><b>3 vendas antigas sem espaço</b><small>Elas continuam nesta visão agregada.</small></span></aside>':''}${goalMarkup(data,label)}<section class="qa-kpis"><article class="qa-kpi">${icon('shopping-cart')}<small>Vendas hoje</small><strong>${money(data.revenue)}</strong></article><article class="qa-kpi">${icon('trending-up')}<small>Lucro estimado</small><strong>${money(data.profit)}</strong></article><article class="qa-kpi">${icon('users')}<small>Clientes ativos</small><strong>${data.clients}</strong></article><article class="qa-kpi">${icon('package-check')}<small>Pedidos</small><strong>${data.orders}</strong></article></section><section class="qa-panels"><article class="qa-panel"><h3>Desempenho nos últimos 7 dias</h3><div class="qa-chart"><span style="--bar:32%"></span><span style="--bar:52%"></span><span style="--bar:44%"></span><span style="--bar:71%"></span><span style="--bar:63%"></span><span style="--bar:86%"></span><span style="--bar:74%"></span></div></article><article class="qa-panel"><h3>Atividade recente</h3><div class="qa-activity"><div>${icon('receipt-text')}<span><b>Venda concluída</b><small>${SpaceContext.selectionLabel('home')}</small></span><strong>${money(data.revenue/5)}</strong></div><div>${icon('user-plus')}<span><b>Novo cliente</b><small>Cadastro completo</small></span><strong>Agora</strong></div></div></article></section></section>`}
    function renderSales(){const spaceId=SpaceContext.salesId(),available=products.filter(product=>SpaceEngine.productAllowsSpace(product,spaceId)),space=SpaceContext.selectionLabel('sales');return `<section class="qa-page qa-sales" data-qa-page="sales"><header class="qa-page-heading"><div><h2>Nova venda</h2><p>Catálogo e venda vinculados ao espaço escolhido.</p></div><small>Caixa aberto</small></header>${SpaceContext.renderBar('sales')}<section class="qa-context-summary">${icon('shield-check')}<span><b>Venda vinculada a ${space}</b><small>O espaço será gravado junto com a venda.</small></span></section><section class="qa-sale-layout"><article class="qa-catalog"><header><h3>Produtos disponíveis</h3><span>${available.length} itens neste espaço</span></header><div class="qa-product-grid">${available.map(product=>`<button class="qa-product" type="button">${icon(product.itemKind==='service'?'wifi':'package')}<b>${product.nome}</b><small>${money(product.preco)}</small></button>`).join('')}</div></article><aside class="qa-cart"><header><h3>Resumo</h3><span class="badge badge-paid">${space}</span></header><div class="qa-cart-row"><span><b>${available[0].nome}</b><small>1 unidade</small></span><strong>${money(available[0].preco)}</strong></div><div class="qa-total"><span>Total</span><strong>${money(available[0].preco)}</strong></div><button class="qa-finish" type="button">Continuar venda</button></aside></section></section>`}
    function renderAvailability(){const product={spaceAccessMode:'selected_spaces',allowedSpaceIds:[ids.adi,ids.iptv],defaultSpaceId:ids.adi};document.querySelector('#app').innerHTML=`<section class="qa-page qa-product-editor" data-qa-page="availability"><header><h2>Cadastro de produto</h2><p>Defina onde o item ficará disponível sem duplicá-lo.</p></header><article class="qa-editor-card"><div class="field"><label>Nome</label><input value="Kit festa completo" readonly></div>${SpaceContext.availabilityFields(product)}</article></section>`;document.querySelector('#modal').innerHTML=`<div class="modal-bg"><section class="modal-box space-form-modal qa-availability-modal"><header class="modal-head"><div><small>Catálogo por espaço</small><h3>Disponibilidade do item</h3></div><button class="icon-btn" type="button" data-space-close aria-label="Fechar">${icon('x')}</button></header><div class="modal-body"><p>O produto continua único e mantém o mesmo histórico. Escolha apenas onde ele aparece para vender.</p>${SpaceContext.availabilityFields(product)}</div><footer class="modal-foot"><button class="btn btn-light" type="button">Cancelar</button><button class="btn btn-primary" type="button">Salvar disponibilidade</button></footer></section></div>`;SpaceContext.bindProductAvailability(document)}
    function activateNav(kind){document.querySelectorAll('[data-nav]').forEach(item=>item.classList.toggle('active',item.dataset.nav===kind));document.querySelector('[data-qa-title]').textContent=kind==='sales'?'Vender':fixtureState==='availability'?'Produto':'Início'}
    if(fixtureState==='availability'){renderAvailability();activateNav('home')}else if(fixtureState.startsWith('sales')){document.querySelector('#app').innerHTML=renderSales();activateNav('sales')}else{document.querySelector('#app').innerHTML=renderHome();activateNav('home');SpaceContext.bind(document.querySelector('#app'));if(fixtureState==='home-picker')SpaceContext.openPicker('home');if(fixtureState==='goal-adi')SpaceContext.openGoalEditor();if(fixtureState==='manager')SpaceContext.openManager()}
    SpaceContext.bind(document);
    lucide.createIcons();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{document.body.dataset.fixtureReady='true';window.__globalSpacesFixture={ready:true,state:fixtureState,ids,productCount:document.querySelectorAll('.qa-product').length}}));
  </script>
</body>
</html>
