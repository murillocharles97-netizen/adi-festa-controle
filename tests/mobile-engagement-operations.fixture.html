<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Operações mobile · Adi Festa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/visual.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="stylesheet" href="../css/mobile-navigation.css">
  <link rel="stylesheet" href="../css/engagement-operations.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#17233a;font-family:Inter,system-ui,sans-serif}.audit-shell{width:100%;max-width:767px;min-height:100vh;margin:auto;background:#f7f9fb}.audit-header{position:sticky;top:0;z-index:12;display:grid;grid-template-columns:44px minmax(0,1fr) 42px 42px;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 15px 10px;background:#fff;border-bottom:1px solid #e6ebf0}.audit-header button{width:44px;height:44px;border:0;background:transparent;color:#17233a}.audit-header h1,.audit-header p{margin:0}.audit-header h1{font-size:1.25rem}.audit-header p{margin-top:2px;color:#718096;font-size:.72rem}.audit-cloud,.audit-avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#e7f8f3;color:#07866a}.audit-avatar{border-radius:50%;background:#172844;color:#fff;font-weight:900}.audit-content{display:grid;gap:16px;padding:16px 14px calc(92px + env(safe-area-inset-bottom))}.audit-nav{position:fixed;z-index:11;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #e1e6ed;background:#fff}.audit-nav span{display:grid;place-items:center;color:#65738a;font-size:.67rem}.audit-nav .active{color:#009d78;font-weight:900}.audit-nav .primary{align-self:start;width:56px;height:56px;margin:-14px auto 0;border-radius:50%;background:#08ad83;color:#fff;font-size:1.6rem}.audit-title{margin:0;font-size:1.08rem}.audit-subtitle{margin:3px 0 0;color:#6f7d91;font-size:.78rem}.audit-card{padding:15px;border:1px solid #e4e9ef;border-radius:17px;background:#fff;box-shadow:0 6px 20px #17233a0a}.audit-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.audit-section-head h3,.audit-section-head p{margin:0}.audit-section-head p{margin-top:3px;color:#6f7d91;font-size:.72rem}.audit-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.audit-pills button{min-height:39px;padding:0 13px;border:1px solid #e4e9ef;border-radius:999px;background:#fff;color:#17233a;font-weight:750;white-space:nowrap}.audit-pills button.active{border-color:#08ad81;background:#08ad81;color:#fff}.audit-input{display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid #e4e9ef;border-radius:13px;background:#fff}.audit-input input{width:100%;min-height:46px;border:0;outline:0}.campaign-tabs{display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid #e4e9ef}.campaign-tabs span{padding:3px 0 10px;color:#748196;font-size:.75rem;white-space:nowrap}.campaign-tabs .active{border-bottom:2px solid #08ad81;color:#087e62;font-weight:800}.catalog-status-card{padding:17px;border-radius:18px;background:linear-gradient(135deg,#13263c,#203c53);color:#fff}.catalog-status-card header{display:flex;align-items:center;gap:11px}.catalog-status-card header>span{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#08ad81}.catalog-status-card header div{min-width:0;flex:1}.catalog-status-card h2,.catalog-status-card p{margin:0}.catalog-status-card h2{font-size:1.05rem}.catalog-status-card p{margin-top:2px;color:#d4dde7;font-size:.75rem}.catalog-status-card input{width:42px;height:24px;accent-color:#08ad81}.catalog-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px;padding-top:13px;border-top:1px solid #ffffff26}.catalog-kpis span{text-align:center}.catalog-kpis b,.catalog-kpis small{display:block}.catalog-kpis small{margin-top:3px;color:#c8d3df;font-size:.64rem}.catalog-preview{height:92px;border-radius:14px;background:linear-gradient(120deg,#00b586,#0d7b69);color:#fff;padding:15px;position:relative;overflow:hidden}.catalog-preview:after{content:'🍫  🥤';position:absolute;right:17px;bottom:13px;font-size:2.1rem}.catalog-preview b,.catalog-preview small{display:block;max-width:54%}.catalog-preview small{margin-top:4px}.catalog-category-strip{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}.catalog-category-strip span{display:grid;place-items:center;min-width:74px;height:68px;border:1px solid #e4e9ef;border-radius:13px;background:#fff;font-size:.7rem;font-weight:750}.catalog-category-strip span:first-child{border-color:#08ad81;background:#e9f9f4;color:#087e62}.catalog-product-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.catalog-product-mini article{min-width:0;padding:9px;border:1px solid #e4e9ef;border-radius:14px;background:#fff}.catalog-product-mini span{display:grid;place-items:center;height:64px;border-radius:11px;background:#edf8f4;font-size:1.8rem}.catalog-product-mini b,.catalog-product-mini small{display:block}.catalog-product-mini b{margin-top:8px;font-size:.75rem}.catalog-product-mini small{margin-top:4px;color:#07866a;font-weight:800}.campaign-chart{height:128px;padding:14px;border:1px solid #e4e9ef;border-radius:16px;background:linear-gradient(180deg,#fff,#edfaf6);position:relative;overflow:hidden}.campaign-chart:before{content:'';position:absolute;left:11px;right:11px;bottom:22px;height:58px;border-bottom:3px solid #08ad81;transform:skewY(-8deg);border-radius:50%}.campaign-chart b{position:absolute;right:18px;top:32px;padding:5px 8px;border-radius:8px;background:#15364a;color:#fff}.campaign-chart small{position:absolute;left:14px;bottom:7px;color:#758198}.crm-mobile-quick-actions>div{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important}.crm-mobile-filter-entry{display:grid!important;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)!important}.crm-mobile-filter-entry button{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border:1px solid #e4e9ef;border-radius:11px;background:#fff;color:#17233a}.audit-hidden{display:none!important}
  </style>
</head>
<body>
  <div class="audit-shell">
    <header class="audit-header"><button aria-label="Abrir menu"><i data-lucide="menu"></i></button><div><h1 id="audit-title">CRM</h1><p id="audit-subtitle">Relacionamento que gera vendas</p></div><span class="audit-cloud"><i data-lucide="cloud"></i></span><span class="audit-avatar">M</span></header>
    <main class="audit-content" id="app"></main>
    <nav class="audit-nav"><span>Início</span><span>Vender</span><span class="primary">+</span><span class="active">Clientes</span><span>Produtos</span></nav>
  </div>
  <script src="../assets/lucide.min.js"></script>
  <script>
    const icon=name=>`<i data-lucide="${name}"></i>`;
    const screens={
      crm:{title:'CRM',subtitle:'Relacionamento que gera vendas',html:`
        <section><h2 class="audit-title">Quem você quer alcançar?</h2><p class="audit-subtitle">Segmentos prontos para você agir agora.</p></section>
        <section class="crm-opportunity-grid">
          ${[['clock-3','Sumidos há 30 dias','Não compram há 30 dias ou mais',18],['calendar-clock','Renovações em até 7 dias','Vencem nos próximos 7 dias',8],['star','Clientes VIP','Maiores compradores',12],['gift','Perto de ganhar recompensa','A menos de 20% da meta',6],['wallet-cards','Devendo','Com saldo em aberto',73],['user-round-plus','Novos clientes','Cadastrados nos últimos 30 dias',9]].map(([ico,name,copy,count])=>`<button><span class="crm-opportunity-icon">${icon(ico)}</span><span><b>${name}</b><small>${copy}</small></span><strong>${count}</strong>${icon('chevron-right')}</button>`).join('')}
        </section>
        <section class="crm-mobile-filter-entry"><button>${icon('list-filter')} <b>Criar filtro personalizado</b></button><button>${icon('bookmark')} Meus segmentos</button></section>
        <section class="crm-mobile-quick-actions"><h3>Ações rápidas</h3><div><button>${icon('message-circle')}<span>Enviar mensagem</span></button><button>${icon('wand-sparkles')}<span>Criar campanha</span></button><button>${icon('file-down')}<span>Exportar lista</span></button></div></section>`},
      campaign:{title:'Campanha',subtitle:'Aniversário Premiado',html:`
        <nav class="campaign-tabs"><span class="active">Visão geral</span><span>Participantes</span><span>Recompensas</span><span>Configurações</span></nav>
        <section class="campaign-operational-overview">
          <section class="campaign-progress-summary"><div><small>Progresso médio</small><b>62%</b><i><em style="width:62%"></em></i></div><div><small>Participantes</small><b>156</b><span>+24 esta semana</span></div></section>
          <section class="campaign-operational-kpis"><button><span>${icon('party-popper')}</span><small>Perto da recompensa</small><b>27</b></button><button><span>${icon('gift')}</span><small>Podem resgatar</small><b>8</b></button><button><span>${icon('badge-check')}</span><small>Resgatados</small><b>15</b></button></section>
          <section><h3 class="audit-title">Progresso da campanha</h3><div class="campaign-chart"><b>62%</b><small>14/07 · 21/07 · 28/07 · 04/08 · 11/08</small></div></section>
          <section class="campaign-attention"><h3>Atenção</h3><button><span>${icon('user-round-clock')}</span><span><b>Progresso pendente (fiado)</b><small>23 clientes aguardando quitação</small></span><em>Ver clientes</em></button><button><span>${icon('user-round-x')}</span><span><b>Clientes parados</b><small>31 participantes não compram há 15 dias</small></span><em>Ver clientes</em></button></section>
          <section class="campaign-operational-actions"><button>${icon('message-circle')} Enviar lembrete</button><button class="primary">${icon('users-round')} Criar ação com este grupo</button></section>
        </section>`},
      catalog:{title:'Catálogo',subtitle:'Seu catálogo online',html:`
        <section class="catalog-status-card"><header><span>${icon('shopping-bag')}</span><div><h2>Catálogo ativo</h2><p>Aceitando pedidos</p></div><input type="checkbox" checked aria-label="Aceitar pedidos"></header><div class="catalog-kpis"><span><b>27</b><small>Produtos publicados</small></span><span><b>6</b><small>Categorias</small></span><span><b>124</b><small>Visualizações (7 dias)</small></span></div></section>
        <section class="catalog-status-actions"><button>${icon('link')} Copiar link</button><button>${icon('external-link')} Abrir catálogo</button></section>
        <section><div class="audit-section-head"><div><h3>Banner do catálogo</h3><p>Apresentação da sua vitrine.</p></div><button class="btn btn-light">Editar</button></div><div class="catalog-preview"><b>Peça sem sair de casa!</b><small>Rápido, fácil e seguro.</small></div></section>
        <section><div class="audit-section-head"><div><h3>Categorias</h3><p>Ordem e nomes públicos.</p></div><button class="btn btn-light">Ver todas</button></div><div class="catalog-category-strip"><span>Todas</span><span>🥤 Bebidas</span><span>🍫 Doces</span><span>🍔 Combos</span></div></section>
        <section><div class="audit-section-head"><div><h3>Produtos publicados</h3><p>Controle o que o cliente vê.</p></div><button class="btn btn-light">Ver todos</button></div><div class="catalog-product-mini"><article><span>🥤</span><b>Coca Cola 350ml</b><small>R$ 4,00</small></article><article><span>🍔</span><b>Combo X-Burger</b><small>R$ 28,90</small></article><article><span>🍫</span><b>Brigadeiro</b><small>R$ 3,50</small></article></div></section>`},
      orders:{title:'Pedidos',subtitle:'Gerencie os pedidos online',html:`
        <label class="online-order-search">${icon('search')}<input value="" placeholder="Buscar pedido, cliente ou telefone"></label>
        <nav class="online-order-chips"><button class="active">Todos <b>4</b></button><button>Recebidos <b>2</b></button><button>Em preparo <b>1</b></button><button>Prontos <b>1</b></button><button>Entregues <b>0</b></button></nav>
        <section class="online-orders-list">
          <section class="online-order-group group-new"><div class="online-order-group-title"><h3>Pedidos novos</h3><b>2</b></div>${[['1024','Jessica Kings','(17) 99123-4567','62,00','2','há 4 min'],['1023','Marcos Paulo','(17) 98876-5432','35,50','1','há 11 min']].map(([id,name,phone,value,items,time])=>`<article class="online-order-compact tone-new"><header><div><b>#${id}</b><small>${time}</small></div>${icon('ellipsis-vertical')}</header><h3>${name}</h3><a>${icon('message-circle')} ${phone}</a><div class="online-order-value"><b>R$ ${value}</b><span>${items} item${items==='1'?'':'s'}</span><em>Recebido</em></div><button class="online-order-next">Confirmar pedido</button></article>`).join('')}</section>
          <section class="online-order-group group-preparing"><div class="online-order-group-title"><h3>Em preparo</h3><b>1</b></div><article class="online-order-compact tone-preparing"><header><div><b>#1022</b><small>há 23 min</small></div>${icon('ellipsis-vertical')}</header><h3>Ana Clara</h3><a>${icon('message-circle')} (17) 99765-4321</a><div class="online-order-value"><b>R$ 47,80</b><span>3 itens</span><em>Em preparo</em></div><button class="online-order-next">Marcar como pronto</button></article></section>
          <section class="online-order-group group-ready"><div class="online-order-group-title"><h3>Prontos para entrega</h3><b>1</b></div><article class="online-order-compact tone-ready"><header><div><b>#1021</b><small>há 38 min</small></div>${icon('ellipsis-vertical')}</header><h3>Lucas Oficina</h3><a>${icon('message-circle')} (17) 99999-9999</a><div class="online-order-value"><b>R$ 28,00</b><span>2 itens</span><em>Pronto</em></div><button class="online-order-next">Marcar como entregue</button></article></section>
        </section>`}
    };
    const selected=new URLSearchParams(location.search).get('screen')||'crm';
    const screen=screens[selected]||screens.crm;
    document.querySelector('#audit-title').textContent=screen.title;
    document.querySelector('#audit-subtitle').textContent=screen.subtitle;
    document.querySelector('#app').innerHTML=screen.html;
    document.querySelectorAll('.audit-nav span').forEach(item=>item.classList.toggle('active',selected==='campaign'?item.textContent==='Clientes':selected==='catalog'||selected==='orders'?item.textContent==='Produtos':item.textContent==='Clientes'));
    window.lucide?.createIcons();
    window.__engagementAudit={screen,width:innerWidth,horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1,opportunities:document.querySelectorAll('.crm-opportunity-grid>button').length,campaignKpis:document.querySelectorAll('.campaign-operational-kpis>button').length,catalogSections:document.querySelectorAll('.catalog-status-card,.catalog-preview,.catalog-product-mini').length,orderCards:document.querySelectorAll('.online-order-compact').length};
  </script>
</body>
</html>
