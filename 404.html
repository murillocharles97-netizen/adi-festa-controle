<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07141b"><meta name="application-name" content="VECONI"><meta name="description" content="VECONI — Seu negócio mais completo."><title>VECONI</title><link rel="icon" type="image/svg+xml" href="./assets/veconi-icon-v133.svg"><link rel="shortcut icon" href="./assets/veconi-favicon-v133.ico"></head>
<body>
<script>
  (function(){
    const parts=location.pathname.split('/').filter(Boolean),catalogIndex=parts.indexOf('catalogo');
    if(catalogIndex>=0&&parts[catalogIndex+1]){
      const base=`/${parts.slice(0,catalogIndex).join('/')}${catalogIndex?'/':''}`;
      location.replace(`${base}catalogo.html?v=${encodeURIComponent(parts[catalogIndex+1])}${location.search?`&${location.search.slice(1)}`:''}`);
      return;
    }
    location.replace('./');
  })();
</script>
</body>
</html>
