<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Central de Regularização do Fiado · VECONI</title>
  <link rel="icon" href="./assets/veconi-favicon-32-v133.png">
  <link rel="stylesheet" href="./css/fiado-central.css?v=2">
  <script src="./assets/lucide.min.js" defer></script>
  <script src="./js/fiado-central.js?v=2" defer></script>
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <div class="brand"><img src="./assets/veconi-symbol.svg" alt=""><span>VECONI</span></div>
      <div class="session"><button type="button" id="exit-central" class="central-exit">Voltar a Clientes</button></div>
    </div>
  </header>
  <main id="central" class="page" hidden>
    <section class="page-intro">
      <div class="context"><i data-lucide="users"></i> Clientes <i data-lucide="chevron-right"></i> Fiado</div>
      <h1>Central de Regularização do Fiado</h1>
      <p>Confira os lançamentos antigos e confirme a origem de cada um.</p>
    </section>

    <section id="overview" class="overview" aria-label="Resumo da regularização"></section>

    <section id="workspace" class="workspace" data-view="list" aria-label="Contas e lançamentos">
      <aside class="queue">
        <div class="queue-head">
          <h2>Contas</h2>
          <div class="filters" aria-label="Situação das contas">
            <button type="button" data-filter="pending" aria-pressed="true">Para revisar</button>
            <button type="button" data-filter="batch" aria-pressed="false">Lote inicial</button>
          </div>
          <label class="search"><i data-lucide="search"></i><input type="search" id="search" aria-label="Buscar cliente" placeholder="Buscar cliente" autocomplete="off"></label>
        </div>
        <ul id="accounts" class="accounts" aria-label="Lista de clientes"></ul>
      </aside>
      <section id="detail" class="detail" aria-label="Conta selecionada"></section>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <dialog id="review" aria-labelledby="review-title">
      <div id="review-content"></div>
    </dialog>
  </main>
  <main id="denied" class="page denied" hidden>
    <i data-lucide="lock-keyhole"></i>
    <h1>Acesso restrito</h1>
    <p>A Central de Regularização é reservada ao proprietário.</p>
  </main>
</body>
</html>
